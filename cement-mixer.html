<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>🛢️ Cement Mixer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; position: fixed; background: #8fd3ff;
            font-family: 'Arial Rounded MT Bold', 'Chalkboard SE', 'Comic Sans MS', sans-serif; }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
        .screen { position: fixed; inset: 0; z-index: 1500; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; background: rgba(255, 209, 102, .94); text-align: center; padding: 20px; }
        .screen.hidden { display: none; }
        .screen h1 { font-size: clamp(36px, 8vw, 72px); color: #fff; text-shadow: 0 4px 0 #b5651d; }
        .screen p { font-size: clamp(18px, 3.5vw, 26px); color: #5a3e1b; }
        .big-btn { font: inherit; font-size: clamp(24px, 5vw, 36px); padding: 16px 48px; border-radius: 50px; border: 5px solid #fff;
            background: linear-gradient(135deg, #ffb703, #fb8500); color: #fff; cursor: pointer; box-shadow: 0 8px 0 #b55d00; }
        #done-btn { position: fixed; bottom: 4vh; right: 4vw; z-index: 20; display: none; }
        #clear-btn { position: fixed; bottom: 4vh; left: 4vw; z-index: 20; display: none; font-size: clamp(18px, 4vw, 26px); padding: 12px 26px;
            background: linear-gradient(135deg, #90a4ae, #607d8b); box-shadow: 0 6px 0 #37474f; }
        #speak { position: fixed; top: 12px; right: 12px; z-index: 20; width: 48px; height: 48px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6);
            background: rgba(0,0,0,.45); color: #fff; font-size: 22px; cursor: pointer; }
        .rain { position: fixed; top: -60px; font-size: clamp(30px, 6vw, 56px); pointer-events: none; z-index: 1400; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(115vh) rotate(360deg); } }
        #game-nav { position: fixed; top: 12px; left: 12px; z-index: 2000; }
        #nav-toggle { background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.6); color: #fff; font-size: 24px; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; }
        #nav-overlay { position: fixed; inset: 0; background: rgba(10,10,30,.95); z-index: 2001; display: flex; align-items: center; justify-content: center; transition: opacity .3s; }
        #nav-overlay.hidden { opacity: 0; pointer-events: none; }
        #nav-close { position: absolute; top: 24px; right: 24px; background: none; border: none; color: #fff; font-size: 40px; cursor: pointer; }
        .nav-links { display: flex; flex-direction: column; gap: 12px; text-align: center; max-height: 85vh; overflow-y: auto; padding: 10px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 22px; padding: 10px 30px; border-radius: 30px; background: rgba(255,255,255,.1); }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <button id="speak" aria-label="Say it again">🔊</button>
    <button class="big-btn" id="clear-btn">↺ Smooth again</button>
    <button class="big-btn" id="done-btn">✅ Done!</button>
    <div id="game-nav"><button id="nav-toggle" aria-label="Games">☰</button></div>
    <div id="nav-overlay" class="hidden">
        <button id="nav-close" aria-label="Close">✕</button>
        <div class="nav-links"><!-- filled from games.js --></div>
    </div>
    <div id="start" class="screen">
        <h1>🛢️ Cement Mixer</h1>
        <p>Put everything in the drum and spin it to mix.</p>
        <p>Pour the cement, smooth it, and write your letter in it!</p>
        <button class="big-btn" id="start-btn">Let's Mix!</button>
    </div>
    <div id="end" class="screen hidden">
        <h1>🎉 Floor Poured! 🎉</h1>
        <p id="end-msg">The cement is drying. Great job!</p>
        <div id="end-btns"></div>
    </div>

<script src="jobsite.js"></script>
<script>
// =============================================================
// CEMENT MIXER
//  1. Mix: tap water, sand, gravel, cement into the drum, then tap
//     the drum to spin it 10 times (counted out loud).
//  2. Pour: tap a numbered section of the form; the truck drives
//     there and pours. "Pour in number 3!" Any section works;
//     the asked-for one gets a star.
//  3. Smooth & sign: rub to smooth the cement, then finger-write
//     your letter. Done!
// All drawing is in a 1000 x 600 world that's scaled to fit.
// =============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const JOB = typeof JobSite !== 'undefined' && JobSite.inJob();
const VW = 1000, VH = 600, GROUND = 470;
const NUM = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const SPINS_NEEDED = 10, SECTIONS = 5;
let W, H, k, ox, oy, t = 0, last = 0;

let phase = 'menu';     // mix | drive | pour | smooth | write | done
let ingredients = [
    { id: 'water', label: 'Water', x: 560, y: 150, inDrum: false, fly: null },
    { id: 'sand', label: 'Sand', x: 680, y: 150, inDrum: false, fly: null },
    { id: 'gravel', label: 'Gravel', x: 800, y: 150, inDrum: false, fly: null },
    { id: 'cement', label: 'Cement', x: 920, y: 150, inDrum: false, fly: null }
];
let spins = 0, drumAngle = 0, drumSpin = 0;
let truckX = 60, truckTarget = 60;
let sections = [], askFor = 0, pouring = null, stars = 0;
let rough = [], strokes = [], curStroke = null, drying = 0;
let idle = 0, particles = [], writeReadyAt = 0;

// ---------- sound ----------
let AC = null;
function tone(f, d = .15, type = 'triangle', v = .18, slideTo, delay = 0) {
    try {
        AC = AC || new (window.AudioContext || window.webkitAudioContext)();
        if (AC.state === 'suspended') AC.resume();
        const n = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
        o.type = type; o.frequency.setValueAtTime(f, n);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, n + d);
        g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(.001, n + d);
        o.connect(g).connect(AC.destination); o.start(n); o.stop(n + d);
    } catch (e) { }
}
const say = (txt) => JobSite.say(txt);
const sloshSound = () => { tone(160, .35, 'sawtooth', .05, 90); tone(240, .3, 'sine', .08, 120, .05); };
const plop = () => tone(500, .2, 'sine', .2, 150);
const ding = () => { tone(988, .12); tone(1319, .2, 'triangle', .18, null, .08); };
const fanfare = () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .3, 'triangle', .18, null, i * .14));

// ---------- layout ----------
function resize() {
    const DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    k = Math.min(W / VW, H / VH);
    ox = (W - VW * k) / 2; oy = (H - VH * k) / 2;
    ctx.setTransform(DPR * k, 0, 0, DPR * k, DPR * ox, DPR * oy);
}
addEventListener('resize', resize);
resize();
const toWorld = (e) => ({ x: (e.clientX - ox) / k, y: (e.clientY - oy) / k });

// Truck geometry (truck faces left; drum in the middle; chute at the back/right)
const drumC = () => ({ x: truckX + 190, y: GROUND - 120 });
const chuteTip = () => ({ x: truckX + 330, y: GROUND - 40 });
const FORM_X = 540, FORM_W = 420;
function sectionX(i) { return FORM_X + (i + .5) * FORM_W / SECTIONS; }

// ---------- phases ----------
function start() {
    phase = 'mix'; spins = 0; drumSpin = 0; truckX = truckTarget = 60; stars = 0;
    ingredients.forEach(g => { g.inDrum = false; g.fly = null; });
    sections = Array.from({ length: SECTIONS }, () => ({ fill: 0 }));
    strokes = []; drying = 0; idle = 0;
    document.getElementById('start').classList.add('hidden');
    document.getElementById('end').classList.add('hidden');
    tone(400, .1);
    say(prompt());
}
function prompt() {
    if (phase === 'mix') {
        const left = ingredients.filter(g => !g.inDrum);
        if (left.length) return `Tap the ${left[0].label.toLowerCase()} to put it in the mixer!`;
        return spins === 0 ? 'Tap the drum to spin it! Spin it ten times!' : `Keep spinning! ${NUM[spins]}!`;
    }
    if (phase === 'drive' || phase === 'pour') return `Pour the cement in number ${askFor}!`;
    if (phase === 'smooth') return 'Rub the cement to make it smooth!';
    if (phase === 'write') return 'Now write your letter in the wet cement!';
    return '';
}
function nextAsk() {
    const open = sections.map((s, i) => s.fill < 1 ? i + 1 : 0).filter(Boolean);
    askFor = open.length ? open[Math.floor(Math.random() * open.length)] : 0;
}
function startPour() {
    phase = 'drive';
    nextAsk();
    say('Mixed! Now let\'s pour it! Pour in number ' + askFor + '!');
}
function startSmooth() {
    phase = 'smooth';
    // a grid of bumps to rub smooth
    rough = [];
    for (let y = 0; y < 10; y++) for (let x = 0; x < 20; x++) rough.push({ x, y, r: 1 });
    setTimeout(() => say(prompt()), 900);
}
function startWrite() {
    phase = 'write';
    writeReadyAt = t + 1.2;
    say(prompt());
    document.getElementById('clear-btn').style.display = 'block';
    setTimeout(() => { if (phase === 'write') document.getElementById('done-btn').style.display = 'block'; }, 6000);
}
function finish() {
    phase = 'done';
    document.getElementById('done-btn').style.display = 'none';
    document.getElementById('clear-btn').style.display = 'none';
    fanfare();
    // save the letter, scaled 0..1 to the slab
    const scribble = strokes.map(st => st.map(p => [+((p.x - SLAB.x) / SLAB.w).toFixed(3), +((p.y - SLAB.y) / SLAB.h).toFixed(3)]));
    if (JOB) JobSite.complete('pour', { scribble });
    say(JOB ? 'The floor is done! Now the crane!' : 'The floor is done!');
    rain(['🎉', '⭐', '✨', '🛢️']);
    setTimeout(() => {
        const btns = document.getElementById('end-btns');
        btns.innerHTML = '';
        document.getElementById('end-msg').textContent = stars ? `You got ${stars} star${stars > 1 ? 's' : ''} for pouring in the right spot! ⭐` : 'The cement is drying. Great job!';
        if (JOB) btns.appendChild(JobSite.backButton());
        const again = document.createElement('button');
        again.className = 'big-btn'; again.textContent = 'Mix Again';
        again.style.margin = '10px';
        again.onclick = start;
        btns.appendChild(again);
        document.getElementById('end').classList.remove('hidden');
    }, 2600);
}
const SLAB = { x: 150, y: 110, w: 700, h: 360 };

// ---------- input ----------
canvas.addEventListener('pointerdown', (e) => {
    const p = toWorld(e);
    idle = 0;
    if (phase === 'mix') {
        // ingredient?
        for (const g of ingredients) {
            if (!g.inDrum && !g.fly && Math.hypot(p.x - g.x, p.y - g.y) < 60) {
                g.fly = { t: 0, x0: g.x, y0: g.y };
                tone(700, .1, 'triangle', .15, 1000);
                return;
            }
        }
        // drum?
        const d = drumC();
        if (Math.abs(p.x - d.x) < 130 && Math.abs(p.y - d.y) < 90) { spinDrum(); return; }
        say(prompt());
    } else if (phase === 'drive' && !pouring) {
        // tapped a section of the form?
        if (p.x > FORM_X - 20 && p.x < FORM_X + FORM_W + 20 && p.y > GROUND - 160) {
            const i = Math.max(0, Math.min(SECTIONS - 1, Math.floor((p.x - FORM_X) / (FORM_W / SECTIONS))));
            if (sections[i].fill >= 1) { say('That one is full! Pour in number ' + askFor + '!'); return; }
            pouring = { i, t: 0, driving: true };
            truckTarget = sectionX(i) - 330;
            tone(300, .1, 'square', .06);
        } else say(prompt());
    } else if (phase === 'smooth' || phase === 'write') {
        canvas.setPointerCapture(e.pointerId);
        if (phase === 'write') { if (t < writeReadyAt) return; curStroke = [p]; strokes.push(curStroke); tone(200, .08, 'sine', .08); }
        else smoothAt(p);
    }
});
canvas.addEventListener('pointermove', (e) => {
    if (!(e.buttons || e.pressure)) return;
    const p = toWorld(e);
    idle = 0;
    if (phase === 'smooth') smoothAt(p);
    else if (phase === 'write' && curStroke) {
        const q = curStroke[curStroke.length - 1];
        if (Math.hypot(p.x - q.x, p.y - q.y) > 4) curStroke.push({ x: Math.max(SLAB.x, Math.min(SLAB.x + SLAB.w, p.x)), y: Math.max(SLAB.y, Math.min(SLAB.y + SLAB.h, p.y)) });
    }
});
const endStroke = () => {
    if (curStroke && phase === 'write') document.getElementById('done-btn').style.display = 'block';
    curStroke = null;
};
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);

function spinDrum() {
    drumSpin = 1;
    sloshSound();
    if (ingredients.every(g => g.inDrum)) {
        spins++;
        say(spins >= SPINS_NEEDED ? 'Ten! All mixed!' : NUM[spins] + '!');
        if (spins >= SPINS_NEEDED) setTimeout(startPour, 1400);
    } else {
        // spinning is still fun, but we need everything in first
        const left = ingredients.filter(g => !g.inDrum);
        say(`Wheee! Put in the ${left[0].label.toLowerCase()} too!`);
    }
}
function smoothAt(p) {
    let changed = false;
    rough.forEach(c => {
        const cx = SLAB.x + (c.x + .5) * SLAB.w / 20, cy = SLAB.y + (c.y + .5) * SLAB.h / 10;
        if (c.r > 0 && Math.hypot(p.x - cx, p.y - cy) < 60) { c.r = Math.max(0, c.r - .35); changed = true; }
    });
    if (changed && Math.random() < .3) tone(120 + Math.random() * 60, .06, 'sine', .05);
    const left = rough.filter(c => c.r > 0).length / rough.length;
    if (left < .2 && phase === 'smooth') {
        rough.forEach(c => c.r = 0);
        ding();
        startWrite();
    }
}
document.getElementById('done-btn').addEventListener('click', finish);
document.getElementById('clear-btn').addEventListener('click', () => { strokes = []; sloshSound(); });
document.getElementById('start-btn').addEventListener('click', start);
document.getElementById('speak').addEventListener('click', () => say(prompt()));

// ---------- update ----------
function update(dt) {
    idle += dt;
    // ingredients flying into the drum
    ingredients.forEach(g => {
        if (!g.fly) return;
        g.fly.t += dt / .7;
        const d = drumC();
        const tt = Math.min(1, g.fly.t);
        g.x = g.fly.x0 + (d.x + 40 - g.fly.x0) * tt;
        g.y = g.fly.y0 + (d.y - 80 - g.fly.y0) * tt - Math.sin(tt * Math.PI) * 120;
        if (g.fly.t >= 1) {
            g.fly = null; g.inDrum = true; plop();
            for (let i = 0; i < 10; i++) particles.push({ x: d.x + 40, y: d.y - 80, vx: (Math.random() - .5) * 200, vy: -Math.random() * 200, life: 1, c: '#90a4ae' });
            setTimeout(() => say(prompt()), 300);
        }
    });
    drumAngle += dt * (1.2 + drumSpin * 10);
    drumSpin = Math.max(0, drumSpin - dt * 1.5);

    // driving to a section and pouring
    truckX += (truckTarget - truckX) * Math.min(1, dt * 2.5);
    if (pouring) {
        if (pouring.driving && Math.abs(truckTarget - truckX) < 3) { pouring.driving = false; sloshSound(); }
        if (!pouring.driving) {
            pouring.t += dt;
            const s = sections[pouring.i];
            s.fill = Math.min(1, s.fill + dt / 1.6);
            if (Math.random() < .5) { const c = chuteTip(); particles.push({ x: c.x, y: c.y, vx: (Math.random() - .5) * 40, vy: 100, life: .6, c: '#9e9e9e' }); }
            if (s.fill >= 1) {
                const num = pouring.i + 1;
                if (num === askFor) { stars++; ding(); burst(sectionX(pouring.i), GROUND - 60, '#FFD93D'); }
                pouring = null;
                if (sections.every(x => x.fill >= 1)) { say('All poured!'); setTimeout(startSmooth, 1500); phase = 'pour'; }
                else {
                    const wasRight = num === askFor;
                    nextAsk();
                    say((wasRight ? 'Yes, number ' + num + '! ' : 'That was number ' + num + '! ') + 'Now pour in number ' + askFor + '!');
                }
            }
        }
    }
    if (phase === 'done') drying = Math.min(1, drying + dt / 2);
    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; });
    particles = particles.filter(p => p.life > 0);
    // gentle reminder if nothing's happening
    if (idle > 9 && ['mix', 'drive', 'smooth', 'write'].includes(phase)) { idle = 0; say(prompt()); }
}
function burst(x, y, c) { for (let i = 0; i < 16; i++) particles.push({ x, y, vx: (Math.random() - .5) * 300, vy: -Math.random() * 300, life: 1, c }); }
function rain(emojis) {
    for (let i = 0; i < 30; i++) setTimeout(() => {
        const e = document.createElement('div');
        e.className = 'rain'; e.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        e.style.left = Math.random() * 95 + 'vw'; e.style.animationDuration = (2 + Math.random() * 2) + 's';
        document.body.appendChild(e); setTimeout(() => e.remove(), 4200);
    }, i * 70);
}

// ---------- drawing ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function emoji(e, x, y, size) { ctx.font = `${size}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y); }

function drawSideScene() {
    // sky fills the whole screen (even outside the 1000x600 box)
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
    g.addColorStop(0, '#6ec6ff'); g.addColorStop(1, '#d7f0ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.restore();
    ctx.fillStyle = '#c8a26b'; ctx.fillRect(-2000, GROUND, VW + 4000, 2000);
    ctx.fillStyle = '#b58d55'; ctx.fillRect(-500, GROUND, VW + 1000, 8);
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(80, 70, 34, 0, 7); ctx.fill();

    // the form: a wooden box split into numbered sections
    const fy = GROUND - 50;
    ctx.fillStyle = '#9e9e9e'; ctx.fillRect(FORM_X, fy + 20, FORM_W, 30); // gravel bed
    sections.forEach((s, i) => {
        const x = FORM_X + i * FORM_W / SECTIONS, w = FORM_W / SECTIONS;
        if (s.fill > 0) { ctx.fillStyle = '#b0bec5'; ctx.fillRect(x + 3, fy + 50 - 46 * s.fill, w - 6, 46 * s.fill); }
    });
    ctx.fillStyle = '#a0522d';
    for (let i = 0; i <= SECTIONS; i++) ctx.fillRect(FORM_X + i * FORM_W / SECTIONS - 4, fy, 8, 50);
    ctx.fillRect(FORM_X - 4, fy + 44, FORM_W + 8, 8);

    drawTruck();

    // number flags go on top of the truck so they're always tappable
    sections.forEach((s, i) => {
        const x = FORM_X + i * FORM_W / SECTIONS, w = FORM_W / SECTIONS;
        if (phase === 'drive' || phase === 'pour' || phase === 'mix') {
            const glow = (phase === 'drive' && i + 1 === askFor && s.fill < 1);
            const bob = glow ? Math.sin(t * 5) * 6 : 0;
            ctx.fillStyle = s.fill >= 1 ? '#b7e4c7' : glow ? '#ffd166' : '#fff';
            rr(x + w / 2 - 30, fy - 90 + bob, 60, 60, 14); ctx.fill();
            ctx.strokeStyle = '#5a3e1b'; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = '#5a3e1b'; ctx.font = 'bold 44px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(s.fill >= 1 ? '✓' : i + 1, x + w / 2, fy - 58 + bob);
            ctx.fillStyle = '#8d5524'; ctx.fillRect(x + w / 2 - 3, fy - 30 + bob, 6, 30 - bob);
        }
    });

    // ingredients waiting on the shelf
    if (phase === 'mix') {
        if (ingredients.some(g => !g.inDrum)) { ctx.fillStyle = '#8d5524'; ctx.fillRect(500, 205, 480, 12); }
        const next = ingredients.find(g => !g.inDrum && !g.fly);
        ingredients.forEach(g => {
            if (g.inDrum) return;
            const wig = (g === next && idle > 3) ? Math.sin(t * 15) * .2 : 0;
            ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(wig);
            drawIngredient(g.id);
            ctx.restore();
            if (!g.fly) { ctx.fillStyle = '#5a3e1b'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(g.label, g.x, g.y + 76); }
        });
        // spin counter
        if (ingredients.every(g => g.inDrum)) {
            const d = drumC();
            ctx.fillStyle = '#fff'; rr(d.x - 60, 40, 120, 90, 20); ctx.fill();
            ctx.strokeStyle = '#fb8500'; ctx.lineWidth = 5; ctx.stroke();
            ctx.fillStyle = '#fb8500'; ctx.font = 'bold 70px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(spins, d.x, 88);
            if (idle > 3 && spins < SPINS_NEEDED) emoji('👆', d.x + 10, d.y + 10 + Math.sin(t * 6) * 10, 56);
        }
    }
    if (phase === 'drive' && !pouring && idle > 4) {
        emoji('👆', sectionX(askFor - 1), GROUND - 180 + Math.sin(t * 6) * 10, 56);
    }
}

function drawIngredient(id) {
    if (id === 'water') {
        ctx.fillStyle = '#90caf9'; rr(-34, -30, 68, 70, 10); ctx.fill();
        ctx.fillStyle = '#1e88e5'; ctx.fillRect(-34, -5, 68, 45);
        ctx.strokeStyle = '#555'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, -30, 30, Math.PI, 0); ctx.stroke();
        emoji('💧', 0, 10, 30);
    } else if (id === 'sand') {
        ctx.fillStyle = '#e9c46a'; ctx.beginPath(); ctx.ellipse(0, 30, 52, 44, 0, Math.PI, 0); ctx.fill();
        ctx.fillStyle = '#d4a373'; for (let i = 0; i < 12; i++) ctx.fillRect(-30 + (i * 17) % 60, 0 + (i * 11) % 28, 4, 4);
    } else if (id === 'gravel') {
        ['#9e9e9e', '#757575', '#bdbdbd', '#8d8d8d', '#a8a8a8', '#6d6d6d'].forEach((c, i) => {
            ctx.fillStyle = c; ctx.beginPath(); ctx.arc(-30 + (i % 3) * 30, 20 - Math.floor(i / 3) * 24, 16, 0, 7); ctx.fill();
        });
    } else {
        ctx.fillStyle = '#cfd8dc'; rr(-36, -38, 72, 78, 10); ctx.fill();
        ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#455a64'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('CEMENT', 0, 0);
    }
}

function drawTruck() {
    const x = truckX, y = GROUND;
    // chassis
    ctx.fillStyle = '#37474f'; rr(x + 10, y - 70, 310, 22, 6); ctx.fill();
    // cab (front is on the left)
    ctx.fillStyle = '#1e88e5'; rr(x, y - 150, 95, 90, 14); ctx.fill();
    ctx.fillStyle = '#bde0fe'; rr(x + 10, y - 140, 50, 38, 6); ctx.fill();
    ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(x + 5, y - 80, 8, 0, 7); ctx.fill();
    // drum (tilted egg with turning stripes)
    const d = drumC();
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(-.18);
    ctx.fillStyle = '#ff8c00'; ctx.beginPath(); ctx.ellipse(0, 0, 125, 62, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, 125, 62, 0, 0, 7); ctx.clip();
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 16;
    for (let i = -4; i < 6; i++) {
        const sx = ((i * 55 + (drumAngle * 40) % 55));
        ctx.beginPath(); ctx.moveTo(sx - 60, -70); ctx.lineTo(sx + 20, 70); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = '#e65100'; ctx.beginPath(); ctx.ellipse(118, -6, 14, 34, 0, 0, 7); ctx.fill();   // drum opening
    ctx.restore();
    // hopper (where ingredients go in)
    ctx.fillStyle = '#546e7a';
    ctx.beginPath(); ctx.moveTo(d.x + 10, d.y - 82); ctx.lineTo(d.x + 70, d.y - 82); ctx.lineTo(d.x + 52, d.y - 52); ctx.lineTo(d.x + 28, d.y - 52); ctx.fill();
    // chute
    const c = chuteTip();
    ctx.strokeStyle = '#78909c'; ctx.lineWidth = 14; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + 300, y - 100); ctx.lineTo(c.x, c.y - 10); ctx.stroke();
    // cement stream while pouring
    if (pouring && !pouring.driving) {
        ctx.strokeStyle = '#9e9e9e'; ctx.lineWidth = 16;
        ctx.beginPath(); ctx.moveTo(c.x, c.y - 6); ctx.lineTo(c.x + 4, GROUND - 10); ctx.stroke();
    }
    // wheels
    [x + 60, x + 230, x + 290].forEach(wx => {
        ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(wx, y - 26, 26, 0, 7); ctx.fill();
        ctx.fillStyle = '#bbb'; ctx.beginPath(); ctx.arc(wx, y - 26, 11, 0, 7); ctx.fill();
    });
}

function drawSlab() {
    // looking down at the fresh cement
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#7cb342'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.restore();
    // wooden frame
    ctx.fillStyle = '#a0522d'; rr(SLAB.x - 20, SLAB.y - 20, SLAB.w + 40, SLAB.h + 40, 10); ctx.fill();
    const wet = 1 - drying;
    ctx.fillStyle = `rgb(${Math.round(150 + 60 * drying)},${Math.round(160 + 55 * drying)},${Math.round(168 + 50 * drying)})`;
    ctx.fillRect(SLAB.x, SLAB.y, SLAB.w, SLAB.h);
    // bumps still to smooth
    rough.forEach(c => {
        if (c.r <= 0) return;
        const cx = SLAB.x + (c.x + .5) * SLAB.w / 20, cy = SLAB.y + (c.y + .5) * SLAB.h / 10;
        const h = ((c.x * 7 + c.y * 13) % 5) / 5;
        ctx.fillStyle = `rgba(90,100,110,${.45 * c.r})`;
        ctx.beginPath(); ctx.ellipse(cx + h * 8, cy, 14 * c.r + 4, 9 * c.r + 3, h, 0, 7); ctx.fill();
        ctx.fillStyle = `rgba(230,235,240,${.5 * c.r})`;
        ctx.beginPath(); ctx.ellipse(cx + h * 8 - 4, cy - 4, 7 * c.r + 2, 4 * c.r + 1, h, 0, 7); ctx.fill();
    });
    // shine once smooth
    if (phase !== 'smooth') {
        ctx.fillStyle = `rgba(255,255,255,${.18 * wet})`;
        ctx.beginPath(); ctx.ellipse(SLAB.x + SLAB.w * .3, SLAB.y + SLAB.h * .3, 200, 50, -.3, 0, 7); ctx.fill();
    }
    // the letter (pressed in grooves)
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    [['rgba(60,70,80,.8)', 26, 0], ['rgba(255,255,255,.35)', 8, -4]].forEach(([col, lw, off]) => {
        ctx.strokeStyle = col; ctx.lineWidth = lw;
        strokes.forEach(st => {
            ctx.beginPath();
            st.forEach((p, i) => i ? ctx.lineTo(p.x + off, p.y + off) : ctx.moveTo(p.x + off, p.y + off));
            if (st.length === 1) ctx.lineTo(st[0].x + .1 + off, st[0].y + off);
            ctx.stroke();
        });
    });
    // trowel hint
    if (phase === 'smooth' && idle > 2.5) {
        const hx = SLAB.x + SLAB.w / 2 + Math.sin(t * 3) * 200;
        emoji('👆', hx, SLAB.y + SLAB.h / 2, 64);
    }
    if (phase === 'write' && !strokes.length && idle > 2) {
        ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('✍️ Write your letter!', SLAB.x + SLAB.w / 2, SLAB.y + SLAB.h / 2);
    }
}

function drawParticles() {
    particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, 7); ctx.fill(); });
    ctx.globalAlpha = 1;
}

function loop(ts) {
    const dt = last ? Math.min((ts - last) / 1000, .05) : .016;
    last = ts; t += dt;
    if (phase !== 'menu') update(dt);
    if (phase === 'smooth' || phase === 'write' || phase === 'done') drawSlab();
    else drawSideScene();
    drawParticles();
    requestAnimationFrame(loop);
}
sections = Array.from({ length: SECTIONS }, () => ({ fill: 0 }));
requestAnimationFrame(loop);

if (JOB) {
    document.querySelector('#start h1').textContent = '🛢️ Pour the Floor';
    document.querySelectorAll('#start p')[0].textContent = 'Mix the cement, pour it on the gravel, and smooth it out.';
}
document.getElementById('nav-toggle').addEventListener('click', () => document.getElementById('nav-overlay').classList.remove('hidden'));
document.getElementById('nav-close').addEventListener('click', () => document.getElementById('nav-overlay').classList.add('hidden'));
</script>
