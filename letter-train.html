<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>🚂 Letter Train</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; position: fixed; font-family: 'Arial Rounded MT Bold', 'Chalkboard SE', 'Comic Sans MS', sans-serif; }
        body {
            --u: min(13vw, 17vh, 120px);
            background: linear-gradient(180deg, #7ecbff 0%, #bfe6ff 45%, #9bd770 45%, #7cc35a 100%);
        }

        /* Scenery */
        #sun { position: absolute; top: 6vh; right: 8vw; width: 14vmin; height: 14vmin; border-radius: 50%; background: radial-gradient(circle, #fff6a8, #ffd23f 60%, #ffb703); box-shadow: 0 0 60px #ffe066; }
        .cloud { position: absolute; background: #fff; border-radius: 50px; opacity: .9; animation: drift linear infinite; }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
        .cloud::before { width: 55%; height: 140%; top: -60%; left: 15%; }
        .cloud::after { width: 40%; height: 110%; top: -40%; right: 12%; }
        @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
        .hill { position: absolute; bottom: 55%; border-radius: 50% 50% 0 0; background: #8fd16a; }

        /* Track */
        #track { position: absolute; left: 0; right: 0; top: 58%; height: calc(var(--u) * 0.22);
            background: repeating-linear-gradient(90deg, #8b5a2b 0 calc(var(--u) * 0.12), transparent calc(var(--u) * 0.12) calc(var(--u) * 0.4));
            border-top: 6px solid #9aa5b1; border-bottom: 6px solid #9aa5b1; }

        /* Train */
        #train { position: absolute; left: 50%; bottom: calc(42% + var(--u) * 0.15); display: flex; align-items: flex-end; gap: calc(var(--u) * 0.08);
            transform: translateX(calc(-50% + var(--x, 0px))); will-change: transform; }
        #train.moving { transition: transform 2.4s cubic-bezier(.45, .05, .35, 1); }
        .engine { font-size: calc(var(--u) * 1.35); line-height: .85; filter: drop-shadow(0 4px 2px rgba(0, 0, 0, .25)); }
        #train.moving .engine, #train.moving .car { animation: bounce .25s ease-in-out infinite alternate; }
        @keyframes bounce { to { translate: 0 -3px; } }
        .car { position: relative; width: var(--u); height: calc(var(--u) * 0.95); border-radius: calc(var(--u) * 0.14);
            display: flex; align-items: center; justify-content: center; border: 4px solid rgba(0, 0, 0, .25);
            box-shadow: inset 0 -8px 0 rgba(0, 0, 0, .12); margin-bottom: calc(var(--u) * 0.16); }
        .car::before, .car::after { content: ''; position: absolute; bottom: calc(var(--u) * -0.22); width: calc(var(--u) * 0.3); height: calc(var(--u) * 0.3);
            border-radius: 50%; background: radial-gradient(circle, #ddd 25%, #333 30%); }
        .car::before { left: 10%; }
        .car::after { right: 10%; }
        .car .letter { font-size: calc(var(--u) * 0.72); font-weight: bold; color: #fff; opacity: .28; text-shadow: 0 3px 0 rgba(0, 0, 0, .25); }
        .car.filled .letter { opacity: 1; animation: popIn .35s ease; }
        .car.active { outline: 5px dashed #fff; outline-offset: 4px; animation: glow 1s ease-in-out infinite alternate; }
        @keyframes glow { to { outline-color: #ffd23f; } }
        @keyframes popIn { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
        .car.picture { background: #fff7d6 !important; cursor: pointer; }
        .car.picture .letter { opacity: 1; font-size: calc(var(--u) * 0.66); }
        .car.picture.cheer .letter { animation: popIn .5s ease 2; }

        .puff { position: absolute; width: calc(var(--u) * .35); height: calc(var(--u) * .35); border-radius: 50%; background: rgba(255, 255, 255, .9); pointer-events: none; animation: puff 1.6s ease-out forwards; z-index: 5; }
        @keyframes puff { to { transform: translate(calc(var(--u) * .6), calc(var(--u) * -1.6)) scale(2.4); opacity: 0; } }

        /* Choices */
        #choices { position: absolute; left: 0; right: 0; bottom: 4vh; display: flex; justify-content: center; gap: 4vw; padding: 0 4vw; }
        .choice { width: min(26vw, 22vh, 170px); height: min(26vw, 22vh, 170px); border-radius: 28px; border: 6px solid #fff; font: inherit; font-weight: bold;
            font-size: min(17vw, 14vh, 110px); color: #fff; cursor: pointer; box-shadow: 0 8px 0 rgba(0, 0, 0, .25); transition: transform .15s; }
        .choice:active { transform: translateY(4px); }
        .choice.wiggle { animation: wiggle .4s ease; }
        .choice.hint { animation: hintPulse .8s ease-in-out infinite alternate; }
        @keyframes wiggle { 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
        @keyframes hintPulse { to { transform: scale(1.12); box-shadow: 0 0 30px #fff, 0 8px 0 rgba(0, 0, 0, .25); } }
        #choices.hidden { visibility: hidden; }

        #counter { position: absolute; top: 14px; right: 14px; background: rgba(255, 255, 255, .85); border-radius: 30px; padding: 6px 16px; font-size: clamp(18px, 3.5vw, 26px); color: #1c5d99; z-index: 10; }

        /* Shared game menu (list filled by games.js) */
        #game-nav { position: fixed; top: 12px; left: 12px; z-index: 2000; }
        #nav-toggle { background: rgba(0, 0, 0, 0.45); border: 2px solid rgba(255, 255, 255, 0.6); color: #fff; font-size: 24px; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; }
        #nav-overlay { position: fixed; inset: 0; background: rgba(10, 10, 30, 0.95); z-index: 2001; display: flex; align-items: center; justify-content: center; transition: opacity .3s; }
        #nav-overlay.hidden { opacity: 0; pointer-events: none; }
        #nav-close { position: absolute; top: 24px; right: 24px; background: none; border: none; color: #fff; font-size: 40px; cursor: pointer; }
        .nav-links { display: flex; flex-direction: column; gap: 12px; text-align: center; max-height: 85vh; overflow-y: auto; padding: 10px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 22px; padding: 10px 30px; border-radius: 30px; background: rgba(255, 255, 255, 0.1); }

        .screen { position: fixed; inset: 0; z-index: 1500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(126, 203, 255, 0.93); text-align: center; padding: 20px; }
        .screen.hidden { display: none; }
        .screen h1 { font-size: clamp(36px, 8vw, 72px); color: #fff; text-shadow: 0 4px 0 #1c5d99; }
        .screen p { font-size: clamp(18px, 3.5vw, 26px); color: #0d3b66; }
        .big-btn { font: inherit; font-size: clamp(24px, 5vw, 36px); padding: 16px 48px; border-radius: 50px; border: 5px solid #fff; background: linear-gradient(135deg, #ff6b6b, #e63946); color: #fff; cursor: pointer; box-shadow: 0 8px 0 #9d0208; }
        .rain { position: fixed; top: -60px; font-size: clamp(30px, 6vw, 56px); pointer-events: none; z-index: 1400; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(115vh) rotate(360deg); } }
    </style>
</head>

<body>
    <div id="sun"></div>
    <div id="scenery"></div>
    <div id="track"></div>
    <div id="train"></div>
    <div id="choices" class="hidden"></div>
    <div id="counter">🚃 0</div>

    <div id="game-nav"><button id="nav-toggle" aria-label="Games">☰</button></div>
    <div id="nav-overlay" class="hidden">
        <button id="nav-close" aria-label="Close">✕</button>
        <div class="nav-links"><!-- filled from games.js --></div>
    </div>

    <div id="start" class="screen">
        <h1>🚂 Letter Train 🚃</h1>
        <p>Fill each train car with the right letter.</p>
        <p>Spell the word and the train goes choo-choo!</p>
        <button class="big-btn" id="start-btn">All Aboard!</button>
    </div>

    <script src="voice.js"></script>
    <script>
        // ============================================
        // LETTER TRAIN
        // ============================================
        const WORDS = [
            ['LOVE', '❤️'], ['CAT', '🐱'], ['DOG', '🐶'], ['SUN', '☀️'], ['BUS', '🚌'], ['COW', '🐮'], ['PIG', '🐷'],
            ['BEE', '🐝'], ['FOX', '🦊'], ['OWL', '🦉'], ['EGG', '🥚'], ['CAR', '🚗'], ['HAT', '🎩'], ['BED', '🛏️'],
            ['CUP', '🥤'], ['MOON', '🌙'], ['STAR', '⭐'], ['FISH', '🐟'], ['CAKE', '🎂'], ['DUCK', '🦆'], ['FROG', '🐸'],
            ['BEAR', '🐻'], ['TREE', '🌳'], ['BOAT', '⛵'], ['MOM', '👩'], ['DAD', '👨'], ['BALL', '⚽'], ['BOOK', '📖'],
            ['APPLE', '🍎'], ['TRUCK', '🚚'], ['HORSE', '🐴'], ['TRAIN', '🚂']
        ];
        const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const CAR_COLORS = ['#e63946', '#f4a261', '#2a9d8f', '#457b9d', '#9b5de5', '#f15bb5', '#00bbf9', '#06d6a0'];
        const CHOICE_COLORS = ['#ff6b6b', '#4dabf7', '#51cf66', '#fcc419', '#cc5de8'];

        const trainEl = document.getElementById('train');
        const choicesEl = document.getElementById('choices');
        let word = '', emoji = '', idx = 0, misses = 0, busy = true, trains = 0;
        let wordQueue = [];

        // ---------- Sound & speech ----------
        let AC = null;
        function tone(freq, dur = 0.15, type = 'sine', vol = 0.2, slideTo, delay = 0) {
            try {
                AC = AC || new (window.AudioContext || window.webkitAudioContext)();
                if (AC.state === 'suspended') AC.resume();
                const now = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
                o.type = type; o.frequency.setValueAtTime(freq, now);
                if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
                g.gain.setValueAtTime(0.0001, AC.currentTime);
                g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
                o.connect(g).connect(AC.destination); o.start(now); o.stop(now + dur);
            } catch (e) { }
        }
        function say(text) {
            try {
                if (!('speechSynthesis' in window)) return;
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.rate = 0.8; u.pitch = 1.15;
                speechSynthesis.speak(u);
            } catch (e) { }
        }
        function whistle() { tone(660, 0.5, 'triangle', 0.15, null, 0); tone(880, 0.5, 'triangle', 0.12, null, 0); tone(660, 0.6, 'triangle', 0.15, null, 0.55); tone(880, 0.6, 'triangle', 0.12, null, 0.55); }
        function chug(n = 8) { for (let i = 0; i < n; i++) tone(90, 0.12, 'square', 0.05, 60, i * 0.28); }
        const scale = [523, 587, 659, 698, 784, 880, 988, 1046];

        // ---------- Scenery ----------
        (function scenery() {
            const s = document.getElementById('scenery');
            for (let i = 0; i < 4; i++) {
                const c = document.createElement('div');
                c.className = 'cloud';
                const w = 80 + Math.random() * 90;
                c.style.cssText = `width:${w}px;height:${w * 0.35}px;top:${5 + Math.random() * 25}vh;animation-duration:${40 + Math.random() * 40}s;animation-delay:${-Math.random() * 60}s`;
                s.appendChild(c);
            }
            [[-10, 40, 22], [25, 55, 16], [60, 50, 20]].forEach(([l, w, h]) => {
                const hill = document.createElement('div');
                hill.className = 'hill';
                hill.style.cssText = `left:${l}vw;width:${w}vw;height:${h}vh`;
                s.appendChild(hill);
            });
        })();

        function puff() {
            const eng = trainEl.querySelector('.engine');
            if (!eng) return;
            const r = eng.getBoundingClientRect();
            const p = document.createElement('div');
            p.className = 'puff';
            p.style.left = (r.left + r.width * 0.12) + 'px';
            p.style.top = (r.top - r.height * 0.05) + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1700);
        }
        let puffTimer = null;
        function puffing(on) {
            clearInterval(puffTimer);
            if (on) puffTimer = setInterval(puff, 260);
        }

        // ---------- Train building & moving ----------
        function setX(px, animate) {
            trainEl.classList.toggle('moving', !!animate);
            trainEl.style.setProperty('--x', px + 'px');
        }

        function sizeTrain() {
            // engine ≈ 1.3 cars wide; picture car + gaps ≈ 1.3 more
            const u = Math.min(window.innerWidth * 0.94 / (word.length + 2.9), window.innerHeight * 0.17, 120);
            document.body.style.setProperty('--u', u + 'px');
        }
        window.addEventListener('resize', () => { if (word) sizeTrain(); });

        function buildTrain() {
            sizeTrain();
            trainEl.innerHTML = '';
            const eng = document.createElement('div');
            eng.className = 'engine';
            eng.textContent = '🚂';
            trainEl.appendChild(eng);
            const offset = Math.floor(Math.random() * CAR_COLORS.length);
            word.split('').forEach((ch, i) => {
                const car = document.createElement('div');
                car.className = 'car';
                car.style.background = CAR_COLORS[(i + offset) % CAR_COLORS.length];
                car.innerHTML = `<span class="letter">${ch}</span>`;
                trainEl.appendChild(car);
            });
            const pic = document.createElement('div');
            pic.className = 'car picture';
            pic.innerHTML = `<span class="letter">${emoji}</span>`;
            pic.addEventListener('click', () => say(word.toLowerCase()));
            trainEl.appendChild(pic);
        }

        function newWord() {
            busy = true;
            choicesEl.classList.add('hidden');
            if (!wordQueue.length) {
                wordQueue = WORDS.slice(1).sort(() => Math.random() - 0.5);
                if (trains === 0) wordQueue.push(WORDS[0]); // first train always spells LOVE ❤️
            }
            [word, emoji] = wordQueue.pop();
            idx = 0;
            buildTrain();
            setX(window.innerWidth + trainEl.offsetWidth, false);
            void trainEl.offsetWidth; // apply start position before animating
            requestAnimationFrame(() => {
                setX(0, true);
                puffing(true);
                chug(8);
            });
            setTimeout(() => {
                trainEl.classList.remove('moving');
                puffing(false);
                say(emoji === '❤️' ? 'Let\'s spell love!' : `Let's spell ${word.toLowerCase()}!`);
                setTimeout(activateCar, 900);
            }, 2450);
        }

        function activateCar() {
            const cars = trainEl.querySelectorAll('.car:not(.picture)');
            cars.forEach((c, i) => c.classList.toggle('active', i === idx));
            misses = 0;
            const target = word[idx];
            const opts = [target];
            while (opts.length < 3) {
                const l = LETTERS[Math.floor(Math.random() * 26)];
                if (!opts.includes(l)) opts.push(l);
            }
            opts.sort(() => Math.random() - 0.5);
            choicesEl.innerHTML = '';
            const colorOffset = Math.floor(Math.random() * CHOICE_COLORS.length);
            opts.forEach((l, i) => {
                const b = document.createElement('button');
                b.className = 'choice';
                b.textContent = l;
                b.dataset.letter = l;
                b.style.background = CHOICE_COLORS[(i + colorOffset) % CHOICE_COLORS.length];
                b.addEventListener('click', () => choose(l, b));
                choicesEl.appendChild(b);
            });
            choicesEl.classList.remove('hidden');
            busy = false;
            say(target);
        }

        function choose(letter, btn) {
            if (busy) return;
            const target = word[idx];
            if (letter === target) {
                busy = true;
                const car = trainEl.querySelectorAll('.car:not(.picture)')[idx];
                car.classList.remove('active');
                car.classList.add('filled');
                tone(scale[idx % scale.length], 0.3, 'triangle', 0.22);
                puff();
                idx++;
                if (idx >= word.length) {
                    finishWord();
                } else {
                    setTimeout(activateCar, 450);
                }
            } else {
                misses++;
                tone(220, 0.15, 'sine', 0.12, 180);
                if (btn) { btn.classList.remove('wiggle'); void btn.offsetWidth; btn.classList.add('wiggle'); }
                if (misses >= 2) {
                    const right = choicesEl.querySelector(`[data-letter="${target}"]`);
                    if (right) right.classList.add('hint');
                }
                say(target);
            }
        }

        function finishWord() {
            choicesEl.classList.add('hidden');
            trains++;
            document.getElementById('counter').textContent = '🚃 ' + trains;
            const pic = trainEl.querySelector('.picture');
            pic.classList.add('cheer');
            say(word.split('').join(', ') + '. ' + word.toLowerCase() + '!');
            const rainEmojis = [emoji, emoji, '⭐', '🎉', '✨'];
            for (let i = 0; i < 24; i++) {
                setTimeout(() => {
                    const e = document.createElement('div');
                    e.className = 'rain';
                    e.textContent = rainEmojis[Math.floor(Math.random() * rainEmojis.length)];
                    e.style.left = Math.random() * 95 + 'vw';
                    e.style.animationDuration = (2 + Math.random() * 2) + 's';
                    document.body.appendChild(e);
                    setTimeout(() => e.remove(), 4200);
                }, i * 70);
            }
            setTimeout(() => {
                whistle();
                setX(-(window.innerWidth + trainEl.offsetWidth), true);
                puffing(true);
                chug(8);
            }, 1800 + word.length * 450);
            setTimeout(() => { puffing(false); newWord(); }, 1800 + word.length * 450 + 2500);
        }

        document.addEventListener('keydown', (e) => {
            if (busy || e.key.length !== 1) return;
            const k = e.key.toUpperCase();
            if (!LETTERS.includes(k)) return;
            const btn = choicesEl.querySelector(`[data-letter="${k}"]`);
            choose(k, btn);
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start').classList.add('hidden');
            tone(600, 0.05, 'sine', 0.01); // unlock audio on iOS
            whistle();
            newWord();
        });

        // Menu
        document.getElementById('nav-toggle').addEventListener('click', () => document.getElementById('nav-overlay').classList.remove('hidden'));
        document.getElementById('nav-close').addEventListener('click', () => document.getElementById('nav-overlay').classList.add('hidden'));
    </script>
    <script src="games.js"></script>
</body>

</html>
