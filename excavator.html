<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🚜 Excavator Treasure Hunt - Dig Deep!</title>
    <meta name="description"
        content="Dig through layers of dirt with your excavator to uncover buried treasure! 10 challenging levels plus endless dig mode.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Styles for Hamburger Menu */
        #game-nav {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2000;
        }

        #nav-toggle {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            font-size: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        #nav-toggle:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        #nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 30, 0.95);
            z-index: 2001;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
            opacity: 1;
            pointer-events: auto;
        }

        #nav-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #nav-close {
            position: absolute;
            top: 30px;
            right: 30px;
            background: none;
            border: none;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 24px;
            padding: 10px 30px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            transition: background 0.2s;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #B0D4E8 30%, #D2B48C 100%);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Animated background clouds */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 100px;
            opacity: 0.7;
            animation: drift linear infinite;
            pointer-events: none;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 100px;
        }

        @keyframes drift {
            from {
                left: -200px;
            }

            to {
                left: 110%;
            }
        }

        /* Dust particles */
        .dust {
            position: absolute;
            background: rgba(210, 180, 140, 0.5);
            border-radius: 50%;
            animation: dustFloat linear infinite;
            pointer-events: none;
        }

        @keyframes dustFloat {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.3;
            }

            100% {
                transform: translate(var(--dx), var(--dy)) rotate(360deg);
                opacity: 0;
            }
        }

        /* Menu screen */
        #menu {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(139, 90, 43, 0.95), rgba(101, 67, 33, 0.95));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        #menu.hidden {
            display: none;
        }

        .menu-title {
            font-size: clamp(2rem, 8vw, 4rem);
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5), 0 4px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 1rem;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        .menu-subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #FFA500;
            margin-bottom: 2rem;
            text-align: center;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            max-width: 600px;
            width: 100%;
            margin-bottom: 2rem;
            padding: 0 20px;
        }

        .level-btn,
        .mode-btn {
            padding: 15px 25px;
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            font-weight: bold;
            border: 3px solid #FFD700;
            background: linear-gradient(135deg, #FF8C00, #FF6347);
            color: white;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 99, 71, 0.4);
            position: relative;
            overflow: hidden;
        }

        .level-btn::before,
        .mode-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .level-btn:active::before,
        .mode-btn:active::before {
            width: 300px;
            height: 300px;
        }

        .level-btn:hover,
        .mode-btn:hover {
            transform: scale(1.05);
            border-color: #FFA500;
            box-shadow: 0 6px 25px rgba(255, 165, 0, 0.6);
        }

        .mode-btn {
            width: 100%;
            max-width: 300px;
            background: linear-gradient(135deg, #32CD32, #228B22);
            border-color: #FFD700;
            margin: 10px 0;
        }

        /* Game container */
        #gameContainer {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 10px;
        }

        #gameContainer.active {
            display: flex;
        }

        #gameCanvas {
            background: linear-gradient(180deg, #87CEEB 0%, #B0D4E8 20%, #D2B48C 100%);
            border: 4px solid #8B4513;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            touch-action: none;
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: bold;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.7);
            z-index: 50;
            pointer-events: none;
        }

        .hud-item {
            background: rgba(139, 69, 19, 0.9);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #FFD700;
            backdrop-filter: blur(5px);
        }

        .back-btn {
            pointer-events: all;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(101, 67, 33, 0.95);
            transform: scale(1.05);
        }

        /* Touch controls */
        /* Controls get their own space (see layoutGame): a strip along the
           bottom when the screen is tall, the two sides when it's wide. */
        #touchControls {
            position: fixed;
            left: 0; right: 0;
            bottom: calc(14px + env(safe-area-inset-bottom));
            display: none;
            z-index: 50;
            justify-content: center;
            align-items: center;
            gap: 40px;
            pointer-events: none;
        }
        #touchControls.active { display: flex; }
        #touchControls > * { pointer-events: auto; }
        #touchControls.sides {
            top: 70px; bottom: env(safe-area-inset-bottom);
            justify-content: space-between;
            padding: 0 calc(14px + env(safe-area-inset-left)) 0 calc(14px + env(safe-area-inset-right));
        }
        #touchControls.compact .dpad { grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); }
        #touchControls.compact .dig-btn { width: 84px; height: 84px; font-size: 2.1rem; }

        /* D-pad: one tap = one step */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 64px);
            grid-template-rows: repeat(3, 64px);
            gap: 6px;
        }
        .dpad-btn {
            border: 3px solid #FF8C00;
            border-radius: 16px;
            background: radial-gradient(circle at 30% 30%, #FFD700, #FFA500);
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 165, 0, 0.5);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .dpad-btn:active { transform: scale(0.9); }
        .dpad-btn.up { grid-column: 2; grid-row: 1; }
        .dpad-btn.left { grid-column: 1; grid-row: 2; }
        .dpad-btn.right { grid-column: 3; grid-row: 2; }
        .dpad-btn.down { grid-column: 2; grid-row: 3; }

        .dig-btn {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #FF6347, #DC143C);
            border: 4px solid #FFD700;
            border-radius: 50%;
            font-size: 2.5rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(220, 20, 60, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dig-btn:active {
            transform: scale(0.9);
            box-shadow: 0 3px 10px rgba(220, 20, 60, 0.7);
        }

        /* Victory screen */
        #victoryScreen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        #victoryScreen.active {
            display: flex;
        }

        .victory-content {
            text-align: center;
            animation: victoryPop 0.5s ease-out;
        }

        @keyframes victoryPop {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .victory-title {
            font-size: clamp(2.5rem, 10vw, 5rem);
            color: #FFD700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            margin-bottom: 1rem;
        }

        .victory-emoji {
            font-size: clamp(3rem, 12vw, 8rem);
            margin: 20px 0;
            animation: spin 1s ease-in-out;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg) scale(0);
            }

            50% {
                transform: rotate(180deg) scale(1.2);
            }

            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        .emoji-rain {
            position: absolute;
            font-size: clamp(1.5rem, 5vw, 3rem);
            animation: fall linear forwards;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .victory-btn {
            padding: 15px 40px;
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: bold;
            border: 3px solid #FFD700;
            background: linear-gradient(135deg, #FF8C00, #FF6347);
            color: white;
            border-radius: 15px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
        }

        .victory-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(255, 215, 0, 0.6);
        }

        /* Instruction text */
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #FFA500;
            font-size: clamp(0.8rem, 2vw, 1rem);
            text-align: center;
            opacity: 0.9;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .level-grid {
                grid-template-columns: repeat(5, 1fr);
            }

            .instructions.desktop-only {
                display: none;
            }
        }

        @media (min-width: 769px) {
            .instructions.mobile-only {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- Background elements -->
    <div id="clouds"></div>
    <div id="dust"></div>


    <!-- Menu Screen -->
    <div id="menu">
        <h1 class="menu-title">🚜 Excavator Treasure Hunt 🚜</h1>
        <p class="menu-subtitle">Dig deep and uncover the buried treasure!</p>

        <div class="level-grid" id="levelGrid">
            <!-- Levels will be generated here -->
        </div>

        <button class="mode-btn" onclick="startFreePlay()">
            ⛏️ Endless Dig Mode
        </button>

        <p class="instructions desktop-only">Arrow keys or click to drive • Drive into dirt to dig!</p>
        <p class="instructions mobile-only">Tap where you want to go • Drive into dirt to dig!</p>
    </div>

    <!-- Game Container -->
    <div id="gameContainer">
        <div class="hud">
            <!-- Replaced Back Button with Hamburger below -->
            <div class="hud-item" style="color: #FFD700; background: transparent; border: none; padding-left: 60px;">
                LEVEL <span id="levelDisplay">1</span></div>
            <div class="hud-item left">TREASURE: <span id="treasureDisplay">0/1</span></div>
        </div>

        <!-- Hamburger Menu -->
        <div id="game-nav">
            <button id="nav-toggle">☰</button>
        </div>

        <div id="nav-overlay" class="hidden">
            <button id="nav-close">✕</button>
            <div class="nav-links"><!-- filled from games.js -->
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="touchControls">
            <div class="dpad" aria-label="Move one step">
                <button class="dpad-btn up" data-dx="0" data-dy="-1" aria-label="Up">⬆️</button>
                <button class="dpad-btn left" data-dx="-1" data-dy="0" aria-label="Left">⬅️</button>
                <button class="dpad-btn right" data-dx="1" data-dy="0" aria-label="Right">➡️</button>
                <button class="dpad-btn down" data-dx="0" data-dy="1" aria-label="Down">⬇️</button>
            </div>
            <button class="dig-btn" id="digButton">⛏️</button>
        </div>
    </div>

    <!-- Victory Screen -->
    <div id="victoryScreen">
        <div class="victory-content">
            <div class="victory-title">💎 Treasure Found! 💎</div>
            <div class="victory-emoji">🏆</div>
            <div id="victoryMessage" style="color: #FFD700; font-size: clamp(1rem, 4vw, 2rem); margin: 20px 0;">
                Amazing Excavation!
            </div>
            <button class="victory-btn" onclick="nextLevel()">Next Level</button>
            <button class="victory-btn" onclick="returnToMenu()">Main Menu</button>
        </div>
    </div>

    <script src="voice.js"></script>
<script src="jobsite.js"></script>
    <script>
        // Game configuration
        const CELL_SIZE = 50;
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;

        // Game state
        let currentLevel = 0;
        let isFreePlay = false;
        let gameActive = false;
        let digCount = 0;
        let dustParticles = [];

        // Canvas and context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Player state
        let player = {
            gridX: 0,
            gridY: 0,
            x: 0,
            y: 0,
            targetX: 0,
            targetY: 0,
            moving: false,
            facing: 0, // 0=right, 1=down, 2=left, 3=up
            digAnimProgress: 0
        };

        // Input state
        let keys = {};
        // One input = one step. Taps made mid-move wait their turn (up to 3).
        let stepQueue = [];
        function requestStep(dx, dy) {
            if (!gameActive) return;
            if (player.moving) { if (stepQueue.length < 3) stepQueue.push({ dx, dy }); return; }
            tryMove(dx, dy);
        }

        // Construction Site job mode (?job=1): dig out the whole foundation
        const JOB_MODE = typeof JobSite !== 'undefined' && JobSite.inJob();
        let isJob = false;
        const JOB_LEVEL = {
            name: 'Dig the Foundation',
            cols: 13,
            rows: 9,
            layout: [
                "#############",
                "#E..........#",
                "#...........#",
                "#...FFFFFFF.#",
                "#...FFFFFFF.#",
                "#...FFFFFFF.#",
                "#...........#",
                "#...........#",
                "#############"
            ]
        };
        function foundationLeft() {
            let n = 0;
            grid.forEach(row => row.forEach(c => { if (c.type === 'F') n++; }));
            return n;
        }
        function updateJobHud() {
            if (isJob) document.getElementById('treasureDisplay').textContent = foundationLeft() + ' left';
        }

        // Grid state
        let grid = [];
        let treasurePos = { x: 0, y: 0 };

        // Level definitions - 10 challenging dig levels
        const levels = [
            // Level 1 - Simple introduction
            {
                name: "First Dig",
                cols: 12,

                layout: [

                    "#...................#",
                    "#DDDDDDDDDDDDDDDDDDD#",
                    "#D.................D#",
                    "#D.DDDDDDDDDDDDDDD.D#",
                    "#D.D.............D.D#",
                    "#D.D.DDDDDDDDDDD.D.D#",
                    "#D.D.D.........D.D.D#",
                    "#D.D.D.DDDDDDD.D.D.D#",
                    "#D.D.D.D.....D.D.D.D#",
                    "#D.D.D.D.DDD.D.D.D.D#",
                    "#D.D.D.D.DTD.D.D.D.D#",
                    "#D.D.D.D.....D.D.D.D#",
                    "#####################"
                ]
            }
        ];

        // Initialize
        function init() {
            createClouds();
            setupCanvas();
            generateLevelButtons();
            setupEventListeners();
            detectTouchDevice();
            animateBackground();
        }

        // Create animated clouds
        function createClouds() {
            const cloudsContainer = document.getElementById('clouds');
            for (let i = 0; i < 5; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                const size = Math.random() * 60 + 40;
                cloud.style.width = size + 'px';
                cloud.style.height = size * 0.6 + 'px';
                cloud.style.top = Math.random() * 30 + '%';
                cloud.style.left = Math.random() * 100 + '%';
                cloud.style.animationDuration = (Math.random() * 40 + 40) + 's';
                cloud.style.animationDelay = Math.random() * 10 + 's';

                const before = Math.random() * 40 + 30;
                cloud.style.setProperty('--before-size', before + 'px');

                cloudsContainer.appendChild(cloud);
            }
        }

        // Animate background
        function animateBackground() {
            requestAnimationFrame(animateBackground);

            // Update dust particles
            dustParticles = dustParticles.filter(p => p.life > 0);
            dustParticles.forEach(p => {
                p.life--;
            });
        }

        // Setup canvas
        function setupCanvas() {
            const maxWidth = window.innerWidth - 40;
            const maxHeight = window.innerHeight * 0.7;

            const scale = Math.min(maxWidth / CANVAS_WIDTH, maxHeight / CANVAS_HEIGHT);
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;
            canvas.style.width = (CANVAS_WIDTH * scale) + 'px';
            canvas.style.height = (CANVAS_HEIGHT * scale) + 'px';
            layoutGame();
        }

        // Generate level buttons
        function generateLevelButtons() {
            const gridEl = document.getElementById('levelGrid');
            for (let i = 0; i < levels.length; i++) {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.textContent = i + 1;
                btn.onclick = () => startLevel(i);
                gridEl.appendChild(btn);
            }
        }

        // Event listeners
        function setupEventListeners() {
            // Keyboard: one press = one step (holding the key does not repeat)
            const KEY_DIRS = {
                ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
                ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
                ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
                ArrowUp: [0, -1], w: [0, -1], W: [0, -1]
            };
            document.addEventListener('keydown', (e) => {
                if (!gameActive) return;
                if (e.key === ' ' || e.key === 'Enter') {
                    if (!e.repeat) tryDig();
                    e.preventDefault();
                    return;
                }
                const dir = KEY_DIRS[e.key];
                if (dir) {
                    e.preventDefault();
                    if (!e.repeat) requestStep(dir[0], dir[1]);
                }
            });

            // D-pad buttons
            document.querySelectorAll('.dpad-btn').forEach(btn => {
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    requestStep(+btn.dataset.dx, +btn.dataset.dy);
                });
            });

            // Dig button
            const digButton = document.getElementById('digButton');
            digButton.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                tryDig();
            });

            // Tap the play area: take ONE step toward where you tapped
            canvas.addEventListener('pointerdown', (e) => {
                if (!gameActive) return;
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const cx = (e.clientX - rect.left) * (CANVAS_WIDTH / rect.width);
                const cy = (e.clientY - rect.top) * (CANVAS_HEIGHT / rect.height);
                // Compare to the excavator's centre in canvas pixels
                const px = window.offsetX + (player.gridX + 0.5) * window.cellSize;
                const py = window.offsetY + (player.gridY + 0.5) * window.cellSize;
                const ddx = cx - px, ddy = cy - py;
                if (Math.abs(ddx) < window.cellSize / 2 && Math.abs(ddy) < window.cellSize / 2) {
                    tryDig(); // tapped the excavator itself: scoop!
                } else if (Math.abs(ddx) > Math.abs(ddy)) {
                    requestStep(ddx > 0 ? 1 : -1, 0);
                } else {
                    requestStep(0, ddy > 0 ? 1 : -1);
                }
            });

            // Window resize
            window.addEventListener('resize', setupCanvas);
        }

        // Detect touch
        function detectTouchDevice() {
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            if (isTouchDevice) {
                document.getElementById('touchControls').classList.add('active');
            }
            layoutGame();
        }

        // Size the play area so it never sits under the controls or the HUD
        function layoutGame() {
            const vw = window.innerWidth, vh = window.innerHeight;
            const tc = document.getElementById('touchControls');
            const touch = tc.classList.contains('active');
            const wide = vw > vh * 1.15;
            const compact = Math.min(vw, vh) < 500;
            tc.classList.toggle('sides', touch && wide);
            tc.classList.toggle('compact', compact);
            const hud = 70;
            let availW = vw - 24, availH = vh - hud - 16;
            if (touch && wide) availW = vw - 2 * (compact ? 200 : 236);
            else if (touch) availH = vh - hud - (compact ? 196 : 236) - 20;
            const sc = Math.max(.2, Math.min(availW / CANVAS_WIDTH, availH / CANVAS_HEIGHT));
            canvas.style.width = Math.floor(CANVAS_WIDTH * sc) + 'px';
            canvas.style.height = Math.floor(CANVAS_HEIGHT * sc) + 'px';
            const gc = document.getElementById('gameContainer');
            gc.style.justifyContent = 'flex-start';
            gc.style.paddingTop = (hud + Math.max(0, (availH - CANVAS_HEIGHT * sc) / 2)) + 'px';
        }
        window.addEventListener('resize', () => layoutGame());

        // Start level
        function startLevel(levelIndex) {
            currentLevel = levelIndex;
            isFreePlay = false;
            isJob = false;
            document.getElementById('levelDisplay').textContent = (levelIndex + 1) + ': ' + levels[levelIndex].name;
            startGame();
        }

        // Generate random level for free play
        function generateRandomLevel() {
            const cols = 17;
            const rows = 13;
            const layout = Array(rows).fill(null).map(() => Array(cols).fill('.'));

            // Borders
            for (let x = 0; x < cols; x++) {
                layout[0][x] = '#';
                layout[rows - 1][x] = '#';
            }
            for (let y = 0; y < rows; y++) {
                layout[y][0] = '#';
                layout[y][cols - 1] = '#';
            }

            // Random dirt
            for (let y = 3; y < rows - 1; y++) {
                for (let x = 1; x < cols - 1; x++) {
                    if (Math.random() < 0.6) {
                        layout[y][x] = 'D';
                    }
                }
            }

            // Player
            layout[1][1] = 'E';

            // Treasure
            const tx = Math.floor(Math.random() * (cols - 4)) + 2;
            const ty = Math.floor(Math.random() * (rows - 6)) + 4;
            layout[ty][tx] = 'T';

            return {
                name: 'Random Dig',
                cols: cols,
                rows: rows,
                layout: layout.map(row => row.join(''))
            };
        }

        // Start free play
        function startFreePlay() {
            isFreePlay = true;
            isJob = false;
            document.getElementById('levelDisplay').textContent = 'Endless Dig';
            startGame();
        }

        // Start game
        function startGame() {
            digCount = 0;
            // document.getElementById('digCount').textContent = 'Digs: 0'; // Removed as per new HUD

            // Get level
            let level;
            if (isJob) {
                level = JOB_LEVEL;
            } else if (isFreePlay) {
                level = generateRandomLevel();
            } else {
                level = levels[currentLevel];
            }

            // Initialize grid
            grid = [];
            for (let y = 0; y < level.rows; y++) {
                grid[y] = [];
                for (let x = 0; x < level.cols; x++) {
                    const cell = level.layout[y][x];
                    grid[y][x] = {
                        type: cell,
                        dug: false
                    };

                    if (cell === 'E') {
                        player.gridX = x;
                        player.gridY = y;
                        grid[y][x].type = '.';
                    } else if (cell === 'T') {
                        treasurePos = { x, y };
                    }
                }
            }

            player.x = player.gridX;
            player.y = player.gridY;
            player.targetX = player.gridX;
            player.targetY = player.gridY;
            player.moving = false;
            player.facing = 0;
            player.digAnimProgress = 0;
            stepQueue = [];
            document.getElementById('treasureDisplay').textContent = '0/1';
            updateJobHud();

            // Store level
            window.currentLevelData = level;

            // Calculate rendering
            window.cellSize = Math.min(
                CANVAS_WIDTH / level.cols,
                CANVAS_HEIGHT / level.rows
            );
            window.offsetX = (CANVAS_WIDTH - window.cellSize * level.cols) / 2;
            window.offsetY = (CANVAS_HEIGHT - window.cellSize * level.rows) / 2;

            // Show game
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('gameContainer').classList.add('active');
            gameActive = true;

            // Start loop
            requestAnimationFrame(gameLoop);
        }

        // Game loop
        function gameLoop(timestamp) {
            if (!gameActive) return;

            update(timestamp);
            render();

            requestAnimationFrame(gameLoop);
        }

        // Update
        function update(timestamp) {
            // Animate movement
            if (player.moving) {
                const speed = 0.2;
                const diffX = player.targetX - player.x;
                const diffY = player.targetY - player.y;

                player.x += diffX * speed;
                player.y += diffY * speed;

                if (Math.abs(diffX) < 0.01 && Math.abs(diffY) < 0.01) {
                    player.x = player.targetX;
                    player.y = player.targetY;
                    player.gridX = player.targetX;
                    player.gridY = player.targetY;
                    player.moving = false;

                    // Check treasure (or a finished foundation in job mode)
                    updateJobHud();
                    if (isJob && foundationLeft() === 0) {
                        stepQueue = [];
                        if (gameActive) victory();
                    } else if (grid[player.gridY][player.gridX].type === 'T') {
                        stepQueue = [];
                        victory();
                    } else {
                        // Next waiting tap (skip any that bump a wall)
                        while (stepQueue.length && !player.moving) {
                            const q = stepQueue.shift();
                            tryMove(q.dx, q.dy);
                        }
                    }
                }
            }

            // Animate dig
            if (player.digAnimProgress > 0) {
                player.digAnimProgress -= 0.05;
            }
        }

        // Try move
        function tryMove(dx, dy) {
            const newX = player.gridX + dx;
            const newY = player.gridY + dy;
            const level = window.currentLevelData;

            if (newX < 0 || newX >= level.cols || newY < 0 || newY >= level.rows) {
                return;
            }

            const cell = grid[newY][newX];

            // Update facing
            if (dx > 0) player.facing = 0;
            else if (dy > 0) player.facing = 1;
            else if (dx < 0) player.facing = 2;
            else if (dy < 0) player.facing = 3;

            // Driving into dirt digs it out automatically (easier for little hands)
            if (cell.type === 'D' || cell.type === 'F') {
                if (cell.type === 'F') cell.hole = true;
                cell.type = '.';
                player.digAnimProgress = 1;
                digCount++;
                createDust(newX, newY);
                playDig();
            }

            // Can only move to empty or treasure
            if (cell.type === '.' || cell.type === 'T') {
                player.targetX = newX;
                player.targetY = newY;
                player.moving = true;
            }
        }

        // Try dig
        function tryDig() {
            if (player.moving || player.digAnimProgress > 0) return;

            // Determine dig position based on facing
            let digX = player.gridX;
            let digY = player.gridY;

            if (player.facing === 0) digX++;
            else if (player.facing === 1) digY++;
            else if (player.facing === 2) digX--;
            else if (player.facing === 3) digY--;

            const level = window.currentLevelData;
            if (digX < 0 || digX >= level.cols || digY < 0 || digY >= level.rows) {
                return;
            }

            const cell = grid[digY][digX];

            if (cell.type === 'D' || cell.type === 'F') {
                if (cell.type === 'F') cell.hole = true;
                cell.type = '.';
                player.digAnimProgress = 1;
                digCount++;
                updateJobHud();
                if (isJob && foundationLeft() === 0) setTimeout(victory, 400);
                // document.getElementById('digCount').textContent = 'Digs: ' + digCount; // Removed as per new HUD

                // Create dust effect
                createDust(digX, digY);
                playDig();
            }
        }

        // Simple dig "thunk" sound (no audio files needed)
        let audioCtx = null;
        function playDig() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, t);
                osc.frequency.exponentialRampToValueAtTime(60, t + 0.15);
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.2);
            } catch (e) { /* sound is optional */ }
        }

        // Create dust particles
        function createDust(gridX, gridY) {
            for (let i = 0; i < 10; i++) {
                dustParticles.push({
                    x: gridX + Math.random(),
                    y: gridY + Math.random(),
                    vx: (Math.random() - 0.5) * 0.1,
                    vy: (Math.random() - 0.5) * 0.1 - 0.05,
                    life: 30,
                    maxLife: 30,
                    size: Math.random() * 4 + 2
                });
            }
        }

        // Render
        function render() {
            const level = window.currentLevelData;

            // Clear
            const skyGradient = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
            skyGradient.addColorStop(0, '#87CEEB');
            skyGradient.addColorStop(0.3, '#B0D4E8');
            skyGradient.addColorStop(1, '#D2B48C');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Draw grid
            for (let y = 0; y < level.rows; y++) {
                for (let x = 0; x < level.cols; x++) {
                    const cell = grid[y][x];
                    const screenX = window.offsetX + x * window.cellSize;
                    const screenY = window.offsetY + y * window.cellSize;

                    if (cell.type === '#') {
                        // Rock wall
                        const gradient = ctx.createLinearGradient(
                            screenX, screenY,
                            screenX + window.cellSize, screenY + window.cellSize
                        );
                        gradient.addColorStop(0, '#696969');
                        gradient.addColorStop(1, '#505050');
                        ctx.fillStyle = gradient;
                        ctx.fillRect(screenX, screenY, window.cellSize, window.cellSize);

                        ctx.strokeStyle = '#404040';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(screenX, screenY, window.cellSize, window.cellSize);
                    } else if (cell.type === 'D' || cell.type === 'F') {
                        // Dirt
                        const dirtGradient = ctx.createLinearGradient(
                            screenX, screenY,
                            screenX + window.cellSize, screenY + window.cellSize
                        );
                        dirtGradient.addColorStop(0, '#8B4513');
                        dirtGradient.addColorStop(1, '#654321');
                        ctx.fillStyle = dirtGradient;
                        ctx.fillRect(screenX, screenY, window.cellSize, window.cellSize);

                        // Dirt texture
                        ctx.fillStyle = 'rgba(101, 67, 33, 0.3)';
                        for (let i = 0; i < 3; i++) {
                            // Deterministic speckles so the dirt doesn't flicker every frame
                            const h1 = Math.abs(Math.sin((x * 12.9898 + y * 78.233 + i * 37.7) * 43758.5453)) % 1;
                            const h2 = Math.abs(Math.sin((x * 93.989 + y * 67.345 + i * 11.3) * 24634.6345)) % 1;
                            ctx.fillRect(
                                screenX + h1 * window.cellSize * 0.8,
                                screenY + h2 * window.cellSize * 0.8,
                                window.cellSize * 0.2,
                                window.cellSize * 0.2
                            );
                        }

                        ctx.strokeStyle = '#5c3a1f';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(screenX, screenY, window.cellSize, window.cellSize);
                        if (cell.type === 'F') {
                            // Orange "dig here" marker
                            ctx.setLineDash([6, 5]);
                            ctx.strokeStyle = '#FF8C00';
                            ctx.lineWidth = 3;
                            ctx.strokeRect(screenX + 4, screenY + 4, window.cellSize - 8, window.cellSize - 8);
                            ctx.setLineDash([]);
                        }
                    } else if (cell.type === 'T') {
                        // Treasure
                        ctx.fillStyle = '#F5DEB3';
                        ctx.fillRect(screenX, screenY, window.cellSize, window.cellSize);

                        // Treasure chest
                        const tx = screenX + window.cellSize / 2;
                        const ty = screenY + window.cellSize / 2;

                        // Glow
                        const glowGradient = ctx.createRadialGradient(tx, ty, 0, tx, ty, window.cellSize * 0.7);
                        glowGradient.addColorStop(0, 'rgba(255, 215, 0, 0.4)');
                        glowGradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
                        ctx.fillStyle = glowGradient;
                        ctx.fillRect(screenX, screenY, window.cellSize, window.cellSize);

                        ctx.save();
                        ctx.translate(tx, ty);

                        // Chest
                        ctx.fillStyle = '#8B4513';
                        ctx.fillRect(-window.cellSize * 0.3, -window.cellSize * 0.2, window.cellSize * 0.6, window.cellSize * 0.4);

                        ctx.fillStyle = '#FFD700';
                        ctx.fillRect(-window.cellSize * 0.3, -window.cellSize * 0.22, window.cellSize * 0.6, window.cellSize * 0.1);
                        ctx.fillRect(-window.cellSize * 0.08, -window.cellSize * 0.2, window.cellSize * 0.16, window.cellSize * 0.2);

                        ctx.restore();
                    } else {
                        // Empty (dug-out foundation is a deeper brown)
                        ctx.fillStyle = cell.hole ? '#C9A27A' : '#F5DEB3';
                        ctx.fillRect(screenX, screenY, window.cellSize, window.cellSize);
                    }
                }
            }

            // Draw dust particles
            dustParticles.forEach(p => {
                const screenX = window.offsetX + (p.x + p.vx * (p.maxLife - p.life)) * window.cellSize;
                const screenY = window.offsetY + (p.y + p.vy * (p.maxLife - p.life)) * window.cellSize;

                ctx.fillStyle = `rgba(139, 69, 19, ${p.life / p.maxLife * 0.6})`;
                ctx.beginPath();
                ctx.arc(screenX, screenY, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw excavator
            const px = window.offsetX + (player.x + 0.5) * window.cellSize;
            const py = window.offsetY + (player.y + 0.5) * window.cellSize;

            ctx.save();
            ctx.translate(px, py);

            // Rotate based on facing
            const angles = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
            ctx.rotate(angles[player.facing]);

            // Dig animation
            if (player.digAnimProgress > 0) {
                ctx.translate(player.digAnimProgress * 5, 0);
            }

            // Body
            const bodyGradient = ctx.createLinearGradient(
                -window.cellSize * 0.2, -window.cellSize * 0.15,
                window.cellSize * 0.2, window.cellSize * 0.15
            );
            bodyGradient.addColorStop(0, '#FFD700');
            bodyGradient.addColorStop(0.5, '#FFA500');
            bodyGradient.addColorStop(1, '#FF8C00');

            ctx.fillStyle = bodyGradient;
            ctx.fillRect(-window.cellSize * 0.2, -window.cellSize * 0.15, window.cellSize * 0.4, window.cellSize * 0.3);

            // Cabin
            ctx.fillStyle = '#4169E1';
            ctx.fillRect(-window.cellSize * 0.15, -window.cellSize * 0.25, window.cellSize * 0.2, window.cellSize * 0.15);

            // Window
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(-window.cellSize * 0.12, -window.cellSize * 0.22, window.cellSize * 0.14, window.cellSize * 0.09);

            // Arm
            ctx.strokeStyle = '#FF8C00';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(window.cellSize * 0.2, 0);
            const armX = window.cellSize * 0.35;
            const armY = player.digAnimProgress > 0 ? -window.cellSize * 0.1 : window.cellSize * 0.1;
            ctx.lineTo(armX, armY);
            ctx.stroke();

            // Bucket
            ctx.fillStyle = '#696969';
            ctx.beginPath();
            ctx.moveTo(armX, armY);
            ctx.lineTo(armX + window.cellSize * 0.1, armY + window.cellSize * 0.05);
            ctx.lineTo(armX + window.cellSize * 0.1, armY + window.cellSize * 0.15);
            ctx.lineTo(armX, armY + window.cellSize * 0.1);
            ctx.closePath();
            ctx.fill();

            // Tracks
            ctx.fillStyle = '#2F4F4F';
            ctx.fillRect(-window.cellSize * 0.2, window.cellSize * 0.15, window.cellSize * 0.4, window.cellSize * 0.08);

            ctx.restore();
        }

        // Victory
        function victory() {
            if (!gameActive) return;
            gameActive = false;
            document.getElementById('treasureDisplay').textContent = '1/1';

            // Emoji rain
            const emojis = ['💎', '💰', '🏆', '⚡', '✨', '🌟', '💎', '🎉', '🎊'];
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const emoji = document.createElement('div');
                    emoji.className = 'emoji-rain';
                    emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    emoji.style.left = Math.random() * 100 + '%';
                    emoji.style.top = '-50px';
                    emoji.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.getElementById('victoryScreen').appendChild(emoji);

                    setTimeout(() => emoji.remove(), 4000);
                }, i * 80);
            }

            // Message
            if (isJob) {
                JobSite.complete('dig');
                JobSite.say('The hole is dug! Now the dump truck!');
                document.getElementById('victoryMessage').textContent = 'The hole is ready for gravel!';
                document.querySelector('.victory-title').textContent = '🎉 Hole Dug! 🎉';
                document.querySelectorAll('#victoryScreen .victory-btn').forEach(b => b.style.display = 'none');
                const content = document.querySelector('.victory-content');
                if (!content.querySelector('a')) content.appendChild(JobSite.backButton());
            } else if (isFreePlay) {
                document.getElementById('victoryMessage').textContent =
                    `Treasure Found in ${digCount} digs! Dig Another?`;
            } else {
                document.getElementById('victoryMessage').textContent =
                    `Level ${currentLevel + 1} Complete! ${digCount} digs!`;
            }

            document.getElementById('victoryScreen').classList.add('active');
        }

        // Next level
        function nextLevel() {
            document.getElementById('victoryScreen').classList.remove('active');

            if (isFreePlay) {
                startFreePlay();
            } else if (currentLevel < levels.length - 1) {
                startLevel(currentLevel + 1);
            } else {
                document.getElementById('victoryMessage').innerHTML =
                    '🎊 All Levels Complete! 🎊<br>Master Excavator!';
                setTimeout(() => {
                    returnToMenu();
                }, 3000);
            }
        }

        // Return to menu
        function returnToMenu() {
            gameActive = false;
            document.getElementById('victoryScreen').classList.remove('active');
            document.getElementById('gameContainer').classList.remove('active');
            document.getElementById('menu').classList.remove('hidden');
        }

        // Initialize
        init();
        if (JOB_MODE) {
            isJob = true;
            document.getElementById('levelDisplay').textContent = '🏗️ Dig the Hole';
            document.getElementById('levelDisplay').parentNode.firstChild.textContent = '';
            document.querySelector('.hud-item.left').firstChild.textContent = 'DIRT LEFT: ';
            startGame();
        }

        // Menu Logic
        const navToggle = document.getElementById('nav-toggle');
        const navOverlay = document.getElementById('nav-overlay');
        const navClose = document.getElementById('nav-close');

        if (navToggle && navOverlay && navClose) {
            navToggle.addEventListener('click', () => {
                navOverlay.classList.remove('hidden');
            });
            navClose.addEventListener('click', () => {
                navOverlay.classList.add('hidden');
            });
        }
    </script>
    <script src="games.js"></script>
</body>

</html>
