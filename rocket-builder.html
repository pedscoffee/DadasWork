<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>🚀 Rocket Builder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; position: fixed; font-family: 'Arial Rounded MT Bold', 'Chalkboard SE', 'Comic Sans MS', sans-serif; }
        body { background: radial-gradient(ellipse at 70% 10%, #2b2d6e 0%, #141640 50%, #070818 100%); color: #fff; display: flex; flex-direction: column; }
        #stars { position: fixed; inset: 0; pointer-events: none; }
        .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: twinkle ease-in-out infinite alternate; }
        @keyframes twinkle { from { opacity: .2; } to { opacity: 1; } }
        body.launching .star { animation: streak .5s linear infinite; }
        @keyframes streak { from { transform: translateY(-20vh) scaleY(1); } to { transform: translateY(100vh) scaleY(6); } }
        #planet { position: fixed; left: -8vmin; bottom: 18vh; width: 26vmin; height: 26vmin; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffb4a2, #e5989b 50%, #6d597a); box-shadow: 0 0 40px rgba(229, 152, 155, .4); opacity: .8; }
        #planet::after { content: ''; position: absolute; left: -20%; top: 42%; width: 140%; height: 16%; border-radius: 50%; border: 4px solid rgba(255, 221, 210, .7); transform: rotate(-15deg); }

        #prompt { position: relative; z-index: 5; margin: max(12px, 2vh) 70px 0; align-self: center; max-width: calc(100vw - 140px); text-align: center; font-size: clamp(18px, 4vw, 30px); background: rgba(255, 255, 255, .12); border: 3px solid rgba(255, 255, 255, .35); border-radius: 30px; padding: 6px 18px; }
        #prompt b { color: #ffd166; }

        #stage-wrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; z-index: 2; }
        #stage { position: relative; width: 300px; height: 440px; transform-origin: center center; }
        #stage.launch { transition: translate 2.4s cubic-bezier(.55, 0, .9, .4); translate: 0 -140vh; }
        #stage.enter { animation: enter 1s cubic-bezier(.2, .9, .3, 1.1); }
        @keyframes enter { from { translate: 0 100vh; } }
        .slot { position: absolute; }
        .slot svg, .piece svg { width: 100%; height: 100%; overflow: visible; display: block; }
        .slot .ghost { fill: rgba(255, 255, 255, .08); stroke: rgba(255, 255, 255, .85); stroke-width: 3; stroke-dasharray: 8 6; }
        .slot.filled .ghost { stroke-dasharray: none; stroke: rgba(0, 0, 0, .25); }
        .slot.want .ghost { animation: want .6s ease-in-out infinite alternate; }
        @keyframes want { to { fill: rgba(255, 209, 102, .5); stroke: #ffd166; } }
        .slot.nope { animation: nope .4s ease; }
        @keyframes nope { 25% { translate: -8px 0; } 75% { translate: 8px 0; } }
        .slot.snap { animation: snap .35s ease; }
        @keyframes snap { 50% { scale: 1.15; } }
        #pad { position: absolute; left: 30px; right: 30px; top: 428px; height: 14px; background: linear-gradient(#9aa5b1, #5c6670); border-radius: 6px; }
        #pad { transition: opacity .4s; }
        #stage.launch #pad { opacity: 0; }
        #flame { position: absolute; left: 50%; top: 392px; z-index: 0; width: 70px; height: 0; translate: -50% 0; border-radius: 0 0 50% 50% / 0 0 100% 100%;
            background: radial-gradient(ellipse at 50% 0%, #fff 0%, #ffd166 25%, #f77f00 55%, rgba(214, 40, 40, 0) 75%); transition: height .5s; }
        #stage.firing #flame { height: 120px; animation: flicker .08s linear infinite alternate; }
        @keyframes flicker { to { scale: 1.08 .92; } }

        #countdown { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: min(40vw, 40vh); font-weight: bold; color: #ffd166; text-shadow: 0 0 40px #f77f00; pointer-events: none; z-index: 30; }
        #countdown span { animation: countPop .8s ease-out forwards; }
        @keyframes countPop { from { transform: scale(1.6); opacity: 1; } to { transform: scale(.7); opacity: 0; } }

        #tray { position: relative; z-index: 6; height: max(130px, 25vh); flex-shrink: 0; overflow: hidden; display: flex; align-content: center; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2.5vw; padding: 1.5vh 2vw max(14px, 2vh); background: rgba(255, 255, 255, .08); border-top: 3px solid rgba(255, 255, 255, .25); }
        .piece { position: relative; width: 60px; height: 60px; cursor: grab; touch-action: none; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .4)); transition: transform .15s; }
        .piece:active { cursor: grabbing; }
        .piece.dragging { position: fixed; z-index: 100; transition: none; pointer-events: none; filter: drop-shadow(0 10px 10px rgba(0, 0, 0, .5)); }
        .piece.home { transition: left .3s ease, top .3s ease; }
        .piece.picked { transform: scale(1.12); }

        #score { position: fixed; top: 14px; right: 14px; z-index: 10; background: rgba(255, 255, 255, .15); border-radius: 30px; padding: 6px 14px; font-size: clamp(16px, 3.2vw, 24px); }

        /* Shared game menu (list filled by games.js) */
        #game-nav { position: fixed; top: 12px; left: 12px; z-index: 2000; }
        #nav-toggle { background: rgba(0, 0, 0, 0.45); border: 2px solid rgba(255, 255, 255, 0.6); color: #fff; font-size: 24px; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; }
        #nav-overlay { position: fixed; inset: 0; background: rgba(10, 10, 30, 0.95); z-index: 2001; display: flex; align-items: center; justify-content: center; transition: opacity .3s; }
        #nav-overlay.hidden { opacity: 0; pointer-events: none; }
        #nav-close { position: absolute; top: 24px; right: 24px; background: none; border: none; color: #fff; font-size: 40px; cursor: pointer; }
        .nav-links { display: flex; flex-direction: column; gap: 12px; text-align: center; max-height: 85vh; overflow-y: auto; padding: 10px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 22px; padding: 10px 30px; border-radius: 30px; background: rgba(255, 255, 255, 0.1); }

        .screen { position: fixed; inset: 0; z-index: 1500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(7, 8, 24, 0.92); text-align: center; padding: 20px; }
        .screen.hidden { display: none; }
        .screen h1 { font-size: clamp(36px, 8vw, 72px); color: #ffd166; text-shadow: 0 0 20px #f77f00; }
        .screen p { font-size: clamp(18px, 3.5vw, 26px); color: #dfe7ff; }
        .big-btn { font: inherit; font-size: clamp(24px, 5vw, 36px); padding: 16px 48px; border-radius: 50px; border: 5px solid #fff; background: linear-gradient(135deg, #f77f00, #d62828); color: #fff; cursor: pointer; box-shadow: 0 8px 0 #7a1616; }
    </style>
</head>

<body>
    <div id="stars"></div>
    <div id="planet"></div>
    <div id="prompt">Build a rocket!</div>
    <div id="stage-wrap">
        <div id="stage">
            <div id="pad"></div>
            <div id="flame"></div>
        </div>
    </div>
    <div id="tray"></div>
    <div id="countdown"></div>
    <div id="score">🚀 0</div>

    <div id="game-nav"><button id="nav-toggle" aria-label="Games">☰</button></div>
    <div id="nav-overlay" class="hidden">
        <button id="nav-close" aria-label="Close">✕</button>
        <div class="nav-links"><!-- filled from games.js --></div>
    </div>

    <div id="start" class="screen">
        <h1>🚀 Rocket Builder 🪐</h1>
        <p>Drag each shape into the spot that matches.</p>
        <p>Finish the rocket, count down, and blast off!</p>
        <button class="big-btn" id="start-btn">Let's Build!</button>
    </div>

    <script>
        // ============================================
        // ROCKET BUILDER — learn shapes
        // Every rocket is made of shape "slots". Pieces in the tray are
        // the same shapes; drag each one to its matching dashed outline.
        // Tap a piece (or an outline) to hear its name.
        // ============================================
        const SHAPES = {
            circle: { name: 'circle', d: 'M50 0 A50 50 0 1 1 49.9 0 Z' },
            oval: { name: 'oval', d: 'M50 0 A50 50 0 1 1 49.9 0 Z' },
            square: { name: 'square', d: 'M0 0 H100 V100 H0 Z' },
            rectangle: { name: 'rectangle', d: 'M0 0 H100 V100 H0 Z' },
            triangle: { name: 'triangle', d: 'M50 0 L100 100 L0 100 Z' },
            finL: { name: 'triangle', d: 'M100 0 L100 100 L0 100 Z' },
            finR: { name: 'triangle', d: 'M0 0 L100 100 L0 100 Z' },
            semicircle: { name: 'semicircle', d: 'M0 100 A50 100 0 0 1 100 100 Z' },
            star: { name: 'star', d: 'M50 0 L61.8 35.1 L98.9 35.5 L69.1 57.7 L80.2 93.1 L50 71.8 L19.8 93.1 L30.9 57.7 L1.1 35.5 L38.2 35.1 Z' },
            heart: { name: 'heart', d: 'M50 95 C 20 70 0 52 0 30 C 0 12 14 0 29 0 C 40 0 47 7 50 16 C 53 7 60 0 71 0 C 86 0 100 12 100 30 C 100 52 80 70 50 95 Z' },
            diamond: { name: 'diamond', d: 'M50 0 L100 50 L50 100 L0 50 Z' },
            pentagon: { name: 'pentagon', d: 'M50 0 L100 38 L81 100 L19 100 L0 38 Z' },
            hexagon: { name: 'hexagon', d: 'M25 0 H75 L100 50 L75 100 H25 L0 50 Z' },
            trapezoid: { name: 'trapezoid', d: 'M22 0 H78 L100 100 H0 Z' }
        };
        const PALETTE = ['#e63946', '#f4a261', '#2a9d8f', '#457b9d', '#9b5de5', '#f15bb5', '#00bbf9', '#06d6a0', '#ffd166', '#ef476f'];
        // decal shapes in the order they're introduced, with their sizes (design px)
        const DECALS = [['circle', 56, 56], ['square', 50, 50], ['star', 62, 60], ['heart', 58, 54], ['diamond', 56, 56], ['oval', 74, 40], ['hexagon', 62, 54], ['pentagon', 58, 56]];

        const stage = document.getElementById('stage');
        const tray = document.getElementById('tray');
        const promptEl = document.getElementById('prompt');
        let level = 0, slots = [], pieces = [], placed = 0, busy = true, rockets = 0, picked = null;

        // ---------- Sound & speech ----------
        let AC = null;
        function tone(freq, dur = 0.15, type = 'sine', vol = 0.2, slideTo, delay = 0) {
            try {
                AC = AC || new (window.AudioContext || window.webkitAudioContext)();
                if (AC.state === 'suspended') AC.resume();
                const now = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
                o.type = type; o.frequency.setValueAtTime(freq, now);
                if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
                g.gain.setValueAtTime(0.0001, AC.currentTime);
                g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
                o.connect(g).connect(AC.destination); o.start(now); o.stop(now + dur);
            } catch (e) { }
        }
        function rumble(dur) {
            try {
                AC = AC || new (window.AudioContext || window.webkitAudioContext)();
                const n = AC.sampleRate * dur, buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
                for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.min(1, i / (AC.sampleRate * 0.3)) * (1 - i / n);
                const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
                src.buffer = buf; f.type = 'lowpass'; f.frequency.value = 400; g.gain.value = 0.5;
                src.connect(f).connect(g).connect(AC.destination); src.start();
            } catch (e) { }
        }
        function say(text) {
            try {
                if (!('speechSynthesis' in window)) return;
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.rate = 0.9; u.pitch = 1.15;
                speechSynthesis.speak(u);
            } catch (e) { }
        }

        // ---------- Scenery ----------
        (function stars() {
            const box = document.getElementById('stars');
            for (let i = 0; i < 70; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.left = Math.random() * 100 + 'vw';
                s.style.top = Math.random() * 100 + 'vh';
                s.style.animationDuration = (1 + Math.random() * 2) + 's';
                s.style.animationDelay = (-Math.random() * 2) + 's';
                box.appendChild(s);
            }
        })();

        // ---------- Rocket design ----------
        // Design space: 300 x 470. Body spans y 150–390.
        function designRocket(lv) {
            const bodyColor = PALETTE[Math.floor(Math.random() * PALETTE.length)];
            // every other piece gets a color different from the body so it stands out
            const others = PALETTE.filter(x => x !== bodyColor);
            const c = () => others[Math.floor(Math.random() * others.length)];
            const parts = [];
            parts.push({ shape: 'rectangle', x: 100, y: 150, w: 100, h: 240, color: bodyColor });
            const nose = lv >= 2 && Math.random() < 0.5 ? { shape: 'semicircle', x: 100, y: 88, w: 100, h: 62 } : { shape: 'triangle', x: 100, y: 58, w: 100, h: 92 };
            parts.push({ ...nose, color: c() });
            if (lv >= 1) {
                const fc = c();
                parts.push({ shape: 'finL', x: 40, y: 300, w: 60, h: 90, color: fc });
                parts.push({ shape: 'finR', x: 200, y: 300, w: 60, h: 90, color: fc });
            }
            // decals on the body: 1 at first, up to 3; new shapes unlock as levels go up
            const nDecals = lv === 0 ? 1 : Math.min(3, lv);
            const pool = DECALS.slice(0, Math.min(DECALS.length, 2 + lv * 2)).sort(() => Math.random() - 0.5);
            if (lv === 0) pool.unshift(DECALS[0]);
            const ys = nDecals === 1 ? [200] : nDecals === 2 ? [180, 270] : [168, 240, 312];
            for (let i = 0; i < nDecals; i++) {
                const [shape, w, h] = pool[i];
                parts.push({ shape, x: 150 - w / 2, y: ys[i] + (56 - h) / 2, w, h, color: c() });
            }
            if (lv >= 3) parts.push({ shape: 'trapezoid', x: 110, y: 390, w: 80, h: 36, color: '#adb5bd' });
            return parts;
        }

        function svgFor(shape, color, ghost) {
            const p = SHAPES[shape].d;
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${ghost
                ? `<path class="ghost" d="${p}" vector-effect="non-scaling-stroke"/>`
                : `<path d="${p}" fill="${color}" stroke="rgba(0,0,0,.25)" stroke-width="3" vector-effect="non-scaling-stroke"/>`}</svg>`;
        }

        // ---------- Layout ----------
        function stageScale() {
            const wrap = document.getElementById('stage-wrap').getBoundingClientRect();
            return Math.max(0.3, Math.min(wrap.width / 330, (wrap.height - 10) / 450, 1.6));
        }
        function layout() {
            stage.style.scale = stageScale();
            const k = stageScale();
            const trayH = tray.clientHeight;
            const left = pieces.filter(pc => !pc.done).length;
            const twoRows = left > 4 && window.innerWidth < 900;
            const maxH = trayH * (twoRows ? 0.4 : 0.78);
            const maxW = window.innerWidth * (twoRows ? 0.19 : 0.24);
            pieces.forEach(pc => {
                if (pc.done) return;
                // pieces in the tray: real size, shrunk to fit the tray
                const fit = Math.min(1, maxH / (pc.part.h * k), maxW / (pc.part.w * k));
                pc.el.style.width = pc.part.w * k * fit + 'px';
                pc.el.style.height = pc.part.h * k * fit + 'px';
            });
        }

        // ---------- Build a level ----------
        function newRocket() {
            busy = true;
            placed = 0; picked = null;
            stage.querySelectorAll('.slot').forEach(s => s.remove());
            tray.innerHTML = '';
            stage.classList.remove('launch', 'firing');
            const parts = designRocket(level);
            slots = parts.map((part, i) => {
                const el = document.createElement('div');
                el.className = 'slot';
                el.style.cssText = `left:${part.x}px;top:${part.y}px;width:${part.w}px;height:${part.h}px;z-index:${i + 1}`;
                el.innerHTML = svgFor(part.shape, null, true);
                el.addEventListener('pointerdown', () => { if (!slot.done) say('This spot needs a ' + SHAPES[part.shape].name + '.'); });
                stage.appendChild(el);
                const slot = { el, part, done: false };
                return slot;
            });
            pieces = slots.map(slot => {
                const el = document.createElement('div');
                el.className = 'piece';
                el.innerHTML = svgFor(slot.part.shape, slot.part.color, false);
                const pc = { el, part: slot.part, done: false };
                attachDrag(pc);
                return pc;
            }).sort(() => Math.random() - 0.5);
            pieces.forEach(pc => tray.appendChild(pc.el));
            stage.classList.remove('enter'); void stage.offsetWidth; stage.classList.add('enter');
            const n = pieces.length;
            promptEl.innerHTML = `Build rocket <b>#${level + 1}</b>! <b>${n}</b> shapes to go.`;
            layout();
            say(level === 0 ? 'Drag each shape to the spot that matches!' : `Rocket number ${level + 1}! ${n} shapes.`);
            setTimeout(() => { busy = false; }, 700);
        }

        // ---------- Dragging ----------
        function slotUnder(x, y, pc) {
            // prefer a free slot of the same shape; otherwise report whatever slot is there
            let match = null, other = null;
            for (const s of slots) {
                if (s.done) continue;
                const r = s.el.getBoundingClientRect();
                const pad = Math.max(24, r.width * 0.25);
                if (x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad) {
                    if (s.part.shape === pc.part.shape) {
                        const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
                        if (!match || d < match.d) match = { s, d };
                    } else other = s;
                }
            }
            return match ? match.s : other;
        }

        function attachDrag(pc) {
            let sx = 0, sy = 0, moved = false, down = false, offX = 0, offY = 0;
            pc.el.addEventListener('pointerdown', (e) => {
                if (busy || pc.done) return;
                down = true; moved = false; sx = e.clientX; sy = e.clientY;
                pc.el.setPointerCapture(e.pointerId);
                tone(520, 0.05, 'sine', 0.06);
            });
            pc.el.addEventListener('pointermove', (e) => {
                if (!down) return;
                if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < 8) return;
                if (!moved) {
                    moved = true;
                    const k = stageScale();
                    const r = pc.el.getBoundingClientRect();
                    // grow to its real size on the rocket while dragging
                    pc.el.style.width = pc.part.w * k + 'px';
                    pc.el.style.height = pc.part.h * k + 'px';
                    offX = pc.part.w * k / 2; offY = pc.part.h * k / 2;
                    pc.el.classList.add('dragging');
                    hintSlots(pc.part.shape, true);
                }
                pc.el.style.left = (e.clientX - offX) + 'px';
                pc.el.style.top = (e.clientY - offY) + 'px';
            });
            const up = (e) => {
                if (!down) return;
                down = false;
                hintSlots(pc.part.shape, false);
                if (!moved) { tapPiece(pc); return; }
                pc.el.classList.remove('dragging');
                pc.el.style.left = ''; pc.el.style.top = '';
                const s = slotUnder(e.clientX, e.clientY, pc);
                if (s && s.part.shape === pc.part.shape) place(pc, s);
                else {
                    if (s) wrongSpot(pc, s);
                    layout();
                }
            };
            pc.el.addEventListener('pointerup', up);
            pc.el.addEventListener('pointercancel', up);
        }

        function hintSlots(shape, on) {
            slots.forEach(s => s.el.classList.toggle('want', on && !s.done && s.part.shape === shape));
        }

        // Tap a piece: hear its name and see where it goes. Tap it again → it flies there.
        function tapPiece(pc) {
            if (picked === pc) {
                const s = slots.find(x => !x.done && x.part.shape === pc.part.shape);
                if (s) { place(pc, s); return; }
            }
            pieces.forEach(p => p.el.classList.remove('picked'));
            picked = pc;
            pc.el.classList.add('picked');
            say(SHAPES[pc.part.shape].name);
            hintSlots(pc.part.shape, true);
            setTimeout(() => { if (picked === pc) hintSlots(pc.part.shape, false); }, 1600);
        }

        function wrongSpot(pc, s) {
            s.el.classList.remove('nope'); void s.el.offsetWidth; s.el.classList.add('nope');
            tone(200, 0.18, 'sine', 0.12, 160);
            say(`That's a ${SHAPES[pc.part.shape].name}. This spot needs a ${SHAPES[s.part.shape].name}.`);
        }

        function place(pc, s) {
            pc.done = true; s.done = true; picked = null;
            pc.el.remove();
            s.el.classList.add('filled');
            s.el.innerHTML = svgFor(s.part.shape, s.part.color, false);
            s.el.classList.remove('snap', 'want'); void s.el.offsetWidth; s.el.classList.add('snap');
            placed++;
            layout();
            tone(440 * Math.pow(2, placed / 12 * 2), 0.22, 'triangle', 0.18);
            const left = slots.length - placed;
            if (left > 0) {
                say(SHAPES[s.part.shape].name + '!');
                promptEl.innerHTML = `Great! <b>${left}</b> more shape${left > 1 ? 's' : ''}.`;
            } else {
                launch();
            }
        }

        // ---------- Countdown & liftoff ----------
        function launch() {
            busy = true;
            promptEl.innerHTML = 'Rocket ready! Count down with me!';
            const cd = document.getElementById('countdown');
            let n = 10;
            const tick = () => {
                if (n === 0) {
                    cd.innerHTML = '';
                    say('Blast off!');
                    stage.classList.add('firing');
                    rumble(3);
                    document.body.classList.add('launching');
                    setTimeout(() => stage.classList.add('launch'), 500);
                    setTimeout(() => {
                        document.body.classList.remove('launching');
                        rockets++;
                        document.getElementById('score').textContent = '🚀 ' + rockets;
                        level++;
                        newRocket();
                    }, 3400);
                    return;
                }
                cd.innerHTML = `<span>${n}</span>`;
                say(String(n));
                tone(300 + (10 - n) * 40, 0.12, 'square', 0.06);
                n--;
                setTimeout(tick, 900);
            };
            setTimeout(tick, 900);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start').classList.add('hidden');
            tone(600, 0.05, 'sine', 0.01); // unlock audio on iOS
            newRocket();
        });
        window.addEventListener('resize', layout);

        // Menu
        document.getElementById('nav-toggle').addEventListener('click', () => document.getElementById('nav-overlay').classList.remove('hidden'));
        document.getElementById('nav-close').addEventListener('click', () => document.getElementById('nav-overlay').classList.add('hidden'));
        layout();
    </script>
    <script src="games.js"></script>
</body>

</html>
