<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>🏗️ Crane</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; position: fixed; background: #8fd3ff;
            font-family: 'Arial Rounded MT Bold', 'Chalkboard SE', 'Comic Sans MS', sans-serif; }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
        .screen { position: fixed; inset: 0; z-index: 1500; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; background: rgba(255, 209, 102, .94); text-align: center; padding: 20px; }
        .screen.hidden { display: none; }
        .screen h1 { font-size: clamp(36px, 8vw, 72px); color: #fff; text-shadow: 0 4px 0 #b5651d; }
        .screen p { font-size: clamp(18px, 3.5vw, 26px); color: #5a3e1b; }
        .big-btn { font: inherit; font-size: clamp(24px, 5vw, 36px); padding: 16px 48px; border-radius: 50px; border: 5px solid #fff; margin: 10px;
            background: linear-gradient(135deg, #ffb703, #fb8500); color: #fff; cursor: pointer; box-shadow: 0 8px 0 #b55d00; }
        #speak { position: fixed; top: 12px; right: 12px; z-index: 20; width: 48px; height: 48px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6);
            background: rgba(0,0,0,.45); color: #fff; font-size: 22px; cursor: pointer; }
        .rain { position: fixed; top: -60px; font-size: clamp(30px, 6vw, 56px); pointer-events: none; z-index: 1400; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(115vh) rotate(360deg); } }
        #game-nav { position: fixed; top: 12px; left: 12px; z-index: 2000; }
        #nav-toggle { background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.6); color: #fff; font-size: 24px; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; }
        #nav-overlay { position: fixed; inset: 0; background: rgba(10,10,30,.95); z-index: 2001; display: flex; align-items: center; justify-content: center; transition: opacity .3s; }
        #nav-overlay.hidden { opacity: 0; pointer-events: none; }
        #nav-close { position: absolute; top: 24px; right: 24px; background: none; border: none; color: #fff; font-size: 40px; cursor: pointer; }
        .nav-links { display: flex; flex-direction: column; gap: 12px; text-align: center; max-height: 85vh; overflow-y: auto; padding: 10px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 22px; padding: 10px 30px; border-radius: 30px; background: rgba(255,255,255,.1); }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <button id="speak" aria-label="Say it again">🔊</button>
    <div id="game-nav"><button id="nav-toggle" aria-label="Games">☰</button></div>
    <div id="nav-overlay" class="hidden">
        <button id="nav-close" aria-label="Close">✕</button>
        <div class="nav-links"><!-- filled from games.js --></div>
    </div>
    <div id="start" class="screen">
        <h1>🏗️ Crane</h1>
        <p>Pick the next floor from the truck. The plan shows the pattern!</p>
        <p>When the crane swings it over the building, tap to drop it.</p>
        <button class="big-btn" id="start-btn">Let's Stack!</button>
    </div>
    <div id="end" class="screen hidden">
        <h1 id="end-title">🎉 Built! 🎉</h1>
        <p id="end-msg"></p>
        <div id="end-btns"></div>
    </div>

<script src="jobsite.js"></script>
<script>
// =============================================================
// CRANE
//  - Tap a floor block on the truck (the plan shows the pattern:
//    red, yellow, red, ...). Matching the pattern = a star.
//    Any block is fine.
//  - The hook carries it up and swings over the building.
//    Tap anywhere to drop. Close to the middle = "Perfect!",
//    otherwise the workers nudge it into place. Nothing falls.
//  - Floors are counted out loud. Last comes the roof.
// =============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const JOB = typeof JobSite !== 'undefined' && JobSite.inJob();
const VW = 1000, VH = 600, GROUND = 530;
const BW = 220, SLAB_TOP = GROUND - 14, MID = 590;
let BH = 56;   // floor height shrinks a little for tall buildings
const JIB_Y = 46, TRUCK_X = 30;
const NUM = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const FREE_COLORS = [['#e63946', '#ffb703'], ['#2a9d8f', '#e9c46a'], ['#9b5de5', '#f15bb5', '#00bbf9'], ['#457b9d', '#a8dadc']];
let W, H, k, ox, oy, t = 0, last = 0;

let plan = [], colors = [], roofType = 'triangle', floors = [];
let mode = 'menu';     // choose | fetch | lift | swing | drop | settle | roof | done
let hook = { x: 500, y: 120 };
let carried = null;    // { color, roof }
let falling = null;    // { x, y, vy, color, roof }
let stars = 0, idle = 0, msg = null, particles = [], swingT = 0, nudge = null, freeRound = 0;

// ---------- sound ----------
let AC = null;
function tone(f, d = .15, type = 'triangle', v = .18, slideTo, delay = 0) {
    try {
        AC = AC || new (window.AudioContext || window.webkitAudioContext)();
        if (AC.state === 'suspended') AC.resume();
        const n = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
        o.type = type; o.frequency.setValueAtTime(f, n);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, n + d);
        g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(.001, n + d);
        o.connect(g).connect(AC.destination); o.start(n); o.stop(n + d);
    } catch (e) { }
}
const say = (s) => JobSite.say(s);
const thud = () => { tone(110, .25, 'sine', .3, 60); tone(80, .2, 'square', .05); };
const clank = () => tone(900, .06, 'square', .06);
const ding = () => { tone(988, .12); tone(1319, .2, 'triangle', .18, null, .08); };
const fanfare = () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, .3, 'triangle', .18, null, i * .13));
const COLOR_NAMES = { '#e63946': 'red', '#ffb703': 'yellow', '#d62828': 'red', '#f1faee': 'white', '#e9c46a': 'yellow', '#2a9d8f': 'green',
    '#8d99ae': 'gray', '#adb5bd': 'light gray', '#457b9d': 'blue', '#a8dadc': 'light blue', '#9b5de5': 'purple', '#f15bb5': 'pink', '#00bbf9': 'blue' };
const cname = (c) => COLOR_NAMES[c] || 'this one';

// ---------- layout ----------
function resize() {
    const DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    k = Math.min(W / VW, H / VH);
    ox = (W - VW * k) / 2; oy = (H - VH * k) / 2;
    ctx.setTransform(DPR * k, 0, 0, DPR * k, DPR * ox, DPR * oy);
}
addEventListener('resize', resize);
resize();
const toWorld = (e) => ({ x: (e.clientX - ox) / k, y: (e.clientY - oy) / k });
const stackTop = () => SLAB_TOP - floors.length * BH;
// the blocks waiting on the truck
function truckBlocks() { return colors.map((c, i) => ({ c, x: TRUCK_X + 50 + i * 80, y: GROUND - 92, w: 70, h: 38 })); }

// ---------- game flow ----------
function start() {
    if (JOB) {
        const b = JobSite.building();
        colors = b.colors; roofType = b.roof;
        plan = Array.from({ length: b.floors }, (_, i) => b.colors[i % b.colors.length]);
    } else {
        colors = FREE_COLORS[freeRound++ % FREE_COLORS.length];
        roofType = ['triangle', 'flat', 'castle'][Math.floor(Math.random() * 3)];
        plan = Array.from({ length: 5 }, (_, i) => colors[i % colors.length]);
    }
    BH = Math.min(56, Math.floor(300 / plan.length));
    floors = []; stars = 0; carried = null; falling = null; nudge = null;
    hook = { x: 500, y: 120 };
    mode = 'choose'; idle = 0;
    document.getElementById('start').classList.add('hidden');
    document.getElementById('end').classList.add('hidden');
    tone(500, .1);
    say(prompt());
}
function prompt() {
    if (mode === 'choose') {
        if (!floors.length) return `Look at the plan! The first floor is ${cname(plan[0])}. Tap the ${cname(plan[0])} block!`;
        return `What comes next in the pattern? ${floors.map(cname).join(', ')}, ...`;
    }
    if (mode === 'swing') return 'Tap to drop it on the building!';
    if (mode === 'roof') return 'Now the roof! Tap to drop it!';
    return '';
}
function pick(color, bx) {
    const want = plan[floors.length];
    if (color === want) { stars++; ding(); flash(color === want ? 'Great pattern! ⭐' : '', bx, GROUND - 150, '#FFD93D'); say(`${cname(color)}! Great pattern!`); }
    else { say(`${cname(color)}! A new pattern!`); flash('Ooh, new pattern!', bx, GROUND - 150, '#fff'); }
    carried = { color, fromX: bx };
    mode = 'fetch';
}
function flash(text, x, y, color) { if (text) msg = { text, x, y, color, life: 1.6 }; }

function landed() {
    const off = falling.x - MID;
    const perfect = Math.abs(off) < BW * 0.12;
    if (falling.roof) {
        mode = 'done';
        thud(); fanfare();
        countFloors();
        return;
    }
    floors.push(falling.color);
    nudge = { from: falling.x, t: 0, perfect };
    thud();
    for (let i = 0; i < 14; i++) particles.push({ x: falling.x + (Math.random() - .5) * BW, y: stackTop() + BH, vx: (Math.random() - .5) * 200, vy: -Math.random() * 120, life: .8, c: 'rgba(200,170,130,.8)' });
    const n = floors.length;
    say(`${perfect ? 'Perfect! ' : ''}Floor ${NUM[n] || n}!`);
    if (perfect) { stars++; flash('Perfect! ⭐', MID, stackTop() - 30, '#FFD93D'); }
    else flash('👷 Nudge!', MID, stackTop() - 30, '#fff');
    falling = null;
    mode = 'settle';
}
function countFloors() {
    let i = 0;
    const step = () => {
        i++;
        litFloor = i;
        tone(400 + i * 80, .2);
        say(NUM[i] || String(i));
        if (i < floors.length) setTimeout(step, 750);
        else setTimeout(() => { litFloor = 0; finish(); }, 1000);
    };
    setTimeout(step, 700);
}
let litFloor = 0;
function finish() {
    const n = floors.length;
    if (JOB) JobSite.complete('stack', { floors: floors.slice() });
    say(`${NUM[n]} floors! ${JOB ? 'Now the finish crew!' : 'What a building!'}`);
    rain(['🎉', '⭐', '🏗️', '✨', '🏢']);
    setTimeout(() => {
        document.getElementById('end-msg').textContent = `${n} floors tall! ${stars ? 'You got ' + stars + ' star' + (stars > 1 ? 's' : '') + '! ⭐' : ''}`;
        const btns = document.getElementById('end-btns'); btns.innerHTML = '';
        if (JOB) btns.appendChild(JobSite.backButton());
        const again = document.createElement('button');
        again.className = 'big-btn'; again.textContent = 'Build Another';
        again.onclick = start; btns.appendChild(again);
        document.getElementById('end').classList.remove('hidden');
    }, 2200);
}
function rain(emojis) {
    for (let i = 0; i < 30; i++) setTimeout(() => {
        const e = document.createElement('div');
        e.className = 'rain'; e.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        e.style.left = Math.random() * 95 + 'vw'; e.style.animationDuration = (2 + Math.random() * 2) + 's';
        document.body.appendChild(e); setTimeout(() => e.remove(), 4200);
    }, i * 70);
}

// ---------- input ----------
canvas.addEventListener('pointerdown', (e) => {
    const p = toWorld(e);
    idle = 0;
    if (mode === 'choose') {
        const hit = truckBlocks().find(b => p.x > b.x - 10 && p.x < b.x + b.w + 10 && p.y > b.y - 30 && p.y < b.y + b.h + 20);
        if (hit) { pick(hit.c, hit.x + hit.w / 2); return; }
        say(prompt());
    } else if (mode === 'swing' || mode === 'roof') {
        if (carried) {
            falling = { x: hook.x, y: hook.y + 40, vy: 0, color: carried.color, roof: carried.roof };
            carried = null; clank();
            mode = 'drop';
        }
    }
});
document.addEventListener('keydown', (e) => {
    if ((e.key === ' ' || e.key === 'Enter') && (mode === 'swing' || mode === 'roof')) {
        canvas.dispatchEvent(new PointerEvent('pointerdown', { clientX: 0, clientY: 0 }));
    }
});
document.getElementById('start-btn').addEventListener('click', start);
document.getElementById('speak').addEventListener('click', () => say(prompt()));

// ---------- update ----------
// steady crane motion (px per second), arrives exactly
function moveHook(tx, ty, dt, speed = 3) {
    const v = 260 * speed * dt;
    const dx = tx - hook.x, dy = ty - hook.y, d = Math.hypot(dx, dy);
    if (d <= v) { hook.x = tx; hook.y = ty; return true; }
    hook.x += dx / d * v; hook.y += dy / d * v;
    return false;
}
const liftY = () => Math.min(130, stackTop() - BH - 80);
function update(dt) {
    idle += dt;
    if (mode === 'fetch') {
        // trolley over the truck, then lower the hook and grab
        if (!carried.down) { if (moveHook(carried.fromX, liftY(), dt, 3.5)) carried.down = true; }
        else if (moveHook(carried.fromX, GROUND - 140, dt, 3)) { clank(); mode = 'lift'; }
    } else if (mode === 'lift') {
        if (moveHook(hook.x, liftY(), dt, 3.5)) {
            mode = carried.roof ? 'roof' : 'swing'; swingT = 0;
            say(prompt());
        }
    } else if (mode === 'swing' || mode === 'roof') {
        // gentle swing back and forth over the building
        swingT += dt;
        const target = MID + Math.sin(swingT * 1.3) * 180;
        hook.x += (target - hook.x) * Math.min(1, dt * 4);
        hook.y = liftY();
    } else if (mode === 'drop') {
        falling.vy += 1400 * dt; falling.y += falling.vy * dt;
        const h = falling.roof ? 0 : BH;   // roofs are drawn up from their base
        if (falling.y + h >= stackTop()) {
            falling.y = stackTop() - h;
            landed();
        }
    } else if (mode === 'settle') {
        nudge.t += dt / .45;
        if (nudge.t >= 1) {
            nudge = null;
            if (floors.length >= plan.length) {
                carried = { roof: true, color: '#6d4c41', fromX: TRUCK_X + 140 };
                mode = 'fetch';
                setTimeout(() => say('Time for the roof!'), 300);
            } else { mode = 'choose'; idle = 0; setTimeout(() => say(prompt()), 500); }
        }
        moveHook(hook.x, liftY(), dt);
    } else if (mode === 'choose') {
        moveHook(TRUCK_X + 140, liftY(), dt, 2);
    }
    if (msg) { msg.life -= dt; msg.y -= 20 * dt; if (msg.life <= 0) msg = null; }
    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; });
    particles = particles.filter(p => p.life > 0);
    if (idle > 10 && ['choose', 'swing', 'roof'].includes(mode)) { idle = 0; say(prompt()); }
}

// ---------- drawing ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function emoji(e, x, y, size) { ctx.fillStyle = '#000'; ctx.font = `${size}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y); }

function drawBlock(x, y, w, h, color, floorIndex = -1) {
    ctx.fillStyle = color; rr(x, y, w, h, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 2; ctx.stroke();
    const n = w > 150 ? 4 : 2;
    for (let i = 0; i < n; i++) {
        const ww = w * .13, wx = x + w * (.1 + i * (.8 / n)) + (w * .8 / n - ww) / 2;
        if (floorIndex === 0 && i === 1) { ctx.fillStyle = '#6d4c41'; rr(wx, y + h * .25, ww * 1.2, h * .75, 4); ctx.fill(); continue; }
        ctx.fillStyle = '#bde0fe'; rr(wx, y + h * .2, ww, h * .5, 3); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }
    if (floorIndex >= 0 && litFloor > floorIndex) {
        ctx.fillStyle = 'rgba(255,255,180,.55)'; rr(x, y, w, h, 5); ctx.fill();
        ctx.fillStyle = '#5a3e1b'; ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(floorIndex + 1, x + w / 2, y + h / 2);
    }
}
function drawRoof(x, yBase, w) {
    ctx.fillStyle = '#6d4c41';
    if (roofType === 'triangle') { ctx.beginPath(); ctx.moveTo(x - 14, yBase); ctx.lineTo(x + w / 2, yBase - 70); ctx.lineTo(x + w + 14, yBase); ctx.fill(); }
    else if (roofType === 'castle') { ctx.fillStyle = '#6c757d'; for (let i = 0; i < 5; i++) ctx.fillRect(x + i * w / 4.5, yBase - 28, w / 9, 28); }
    else { ctx.fillRect(x - 8, yBase - 14, w + 16, 14); }
}

function draw() {
    // sky everywhere
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
    g.addColorStop(0, '#6ec6ff'); g.addColorStop(1, '#d7f0ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.restore();
    ctx.fillStyle = '#c8a26b'; ctx.fillRect(-2000, GROUND, VW + 4000, 2000);
    ctx.fillStyle = '#b58d55'; ctx.fillRect(-500, GROUND, VW + 1000, 8);

    // the plan (pattern card)
    ctx.fillStyle = '#fff'; rr(20, 70, 70 + plan.length * 0, 40 + plan.length * 34, 12); ctx.fill();
    ctx.strokeStyle = '#1e88e5'; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = '#1e88e5'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('PLAN', 55, 88);
    for (let i = 0; i < plan.length; i++) {
        const y = 70 + 40 + (plan.length - 1 - i) * 34;   // first floor at the bottom, like the building
        ctx.fillStyle = plan[i]; rr(32, y, 46, 26, 4); ctx.fill();
        if (i < floors.length) { ctx.fillStyle = '#2e7d32'; ctx.font = 'bold 20px sans-serif'; ctx.fillText('✓', 55, y + 14); }
        if (i === floors.length && mode === 'choose') { ctx.strokeStyle = '#ff7f11'; ctx.lineWidth = 4; rr(28, y - 4, 54, 34, 6); ctx.stroke(); }
    }

    // slab + stacked floors
    ctx.fillStyle = '#cfd8dc'; ctx.fillRect(MID - BW / 2 - 14, SLAB_TOP, BW + 28, 14);
    floors.forEach((c, i) => {
        let x = MID - BW / 2;
        if (nudge && i === floors.length - 1) x = nudge.from - BW / 2 + (MID - nudge.from) * Math.min(1, nudge.t);
        drawBlock(x, SLAB_TOP - (i + 1) * BH, BW, BH, c, i);
    });
    if (mode === 'done') drawRoof(MID - BW / 2, stackTop(), BW);
    if (nudge && !nudge.perfect) emoji('👷', nudge.from < MID ? MID - BW / 2 - 30 : MID + BW / 2 + 30, SLAB_TOP - floors.length * BH + 20, 40);

    // crane: tower, jib, trolley, cable, hook
    const TX = 880;
    ctx.strokeStyle = '#f4a100'; ctx.lineWidth = 5;
    for (let y = JIB_Y; y < GROUND; y += 40) {
        ctx.strokeRect(TX - 20, y, 40, 40);
        ctx.beginPath(); ctx.moveTo(TX - 20, y); ctx.lineTo(TX + 20, y + 40); ctx.stroke();
    }
    ctx.fillStyle = '#f4a100'; ctx.fillRect(120, JIB_Y - 14, 870, 16);
    ctx.fillStyle = '#ffb703'; rr(TX - 34, JIB_Y + 2, 68, 50, 8); ctx.fill();          // cab
    ctx.fillStyle = '#bde0fe'; rr(TX - 26, JIB_Y + 10, 34, 26, 4); ctx.fill();
    ctx.fillStyle = '#607d8b'; ctx.fillRect(950, JIB_Y - 4, 40, 40);                   // counterweight
    ctx.fillStyle = '#455a64'; rr(hook.x - 20, JIB_Y + 2, 40, 14, 4); ctx.fill();     // trolley
    ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(hook.x, JIB_Y + 16); ctx.lineTo(hook.x, hook.y); ctx.stroke();
    ctx.strokeStyle = '#555'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(hook.x, hook.y + 10, 10, -.5, Math.PI + .5, false); ctx.stroke();
    // whatever the hook is carrying
    if (carried && (mode !== 'fetch' || Math.abs(hook.y - (GROUND - 140)) < 6)) {
        if (carried.roof) {
            ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(hook.x, hook.y + 18); ctx.lineTo(hook.x - BW / 2, hook.y + 110); ctx.moveTo(hook.x, hook.y + 18); ctx.lineTo(hook.x + BW / 2, hook.y + 110); ctx.stroke();
            drawRoof(hook.x - BW / 2, hook.y + 110, BW);
        } else {
            ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(hook.x, hook.y + 18); ctx.lineTo(hook.x - BW / 2 + 10, hook.y + 44); ctx.moveTo(hook.x, hook.y + 18); ctx.lineTo(hook.x + BW / 2 - 10, hook.y + 44); ctx.stroke();
            drawBlock(hook.x - BW / 2, hook.y + 44, BW, BH, carried.color);
        }
    }
    if (falling) {
        if (falling.roof) drawRoof(falling.x - BW / 2, falling.y, BW);
        else drawBlock(falling.x - BW / 2, falling.y, BW, BH, falling.color);
    }
    // a little shadow guide under the swinging block
    if (mode === 'swing' || mode === 'roof') {
        ctx.fillStyle = 'rgba(0,0,0,.12)';
        ctx.fillRect(hook.x - BW / 2, stackTop() - 6, BW, 6);
    }

    // flatbed truck with the choices
    ctx.fillStyle = '#37474f'; rr(TRUCK_X, GROUND - 56, 300, 18, 5); ctx.fill();
    ctx.fillStyle = '#2a9d8f'; rr(TRUCK_X + 300, GROUND - 120, 70, 82, 10); ctx.fill();
    ctx.fillStyle = '#bde0fe'; rr(TRUCK_X + 325, GROUND - 110, 36, 30, 5); ctx.fill();
    [TRUCK_X + 50, TRUCK_X + 230, TRUCK_X + 335].forEach(wx => {
        ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(wx, GROUND - 22, 22, 0, 7); ctx.fill();
        ctx.fillStyle = '#bbb'; ctx.beginPath(); ctx.arc(wx, GROUND - 22, 9, 0, 7); ctx.fill();
    });
    if (mode === 'choose' || mode === 'fetch') {
        truckBlocks().forEach(b => {
            if (mode === 'fetch' && carried && carried.color === b.c && Math.abs(hook.y - (GROUND - 140)) < 6) return;
            const bounce = (mode === 'choose' && idle > 4 && b.c === plan[floors.length]) ? Math.sin(t * 8) * 6 : 0;
            drawBlock(b.x, b.y - 20 + bounce, b.w, b.h + 20, b.c);
        });
    }

    // floor counter
    ctx.fillStyle = 'rgba(255,255,255,.9)'; rr(MID - 70, 70, 140, 60, 16); ctx.fill();
    ctx.fillStyle = '#5a3e1b'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`🏢 ${floors.length}/${plan.length}`, MID, 100);
    // stars
    ctx.fillStyle = '#5a3e1b'; ctx.textAlign = 'right'; ctx.fillText(`⭐ ${stars}`, 840, 100);

    if (mode === 'choose' && idle > 4) {
        const b = truckBlocks().find(b => b.c === plan[floors.length]);
        if (b) emoji('👆', b.x + b.w / 2, b.y - 60 + Math.sin(t * 6) * 8, 46);
    }
    particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, 7); ctx.fill(); });
    ctx.globalAlpha = 1;
    if (msg) {
        ctx.globalAlpha = Math.min(1, msg.life);
        ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.strokeText(msg.text, msg.x, msg.y);
        ctx.fillStyle = msg.color; ctx.fillText(msg.text, msg.x, msg.y);
        ctx.globalAlpha = 1;
    }
}

function loop(ts) {
    const dt = last ? Math.min((ts - last) / 1000, .05) : .016;
    last = ts; t += dt;
    if (mode !== 'menu') update(dt);
    draw();
    requestAnimationFrame(loop);
}
// preview on the menu
if (JOB) { const b = JobSite.building(); colors = b.colors; plan = Array.from({ length: b.floors }, (_, i) => b.colors[i % b.colors.length]); roofType = b.roof;
    document.querySelector('#start h1').textContent = `🏗️ Stack the ${b.name}`; }
else { colors = FREE_COLORS[0]; plan = Array.from({ length: 5 }, (_, i) => colors[i % 2]); }
requestAnimationFrame(loop);

document.getElementById('nav-toggle').addEventListener('click', () => document.getElementById('nav-overlay').classList.remove('hidden'));
document.getElementById('nav-close').addEventListener('click', () => document.getElementById('nav-overlay').classList.add('hidden'));
</script>
<script src="games.js"></script>
</body>
