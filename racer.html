<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Racer</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #87CEEB;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* Hamburger menu (shared look) */
        #game-nav { position: fixed; top: 16px; left: 16px; z-index: 2000; }
        #nav-toggle { background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.5); color: #fff; font-size: 24px;
            width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #nav-overlay { position: fixed; inset: 0; background: rgba(10,10,30,0.95); z-index: 2001; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: opacity .3s; overflow-y: auto; padding: 60px 0; }
        #nav-overlay.hidden { opacity: 0; pointer-events: none; }
        #nav-close { position: absolute; top: 24px; right: 24px; background: none; border: none; color: #fff; font-size: 40px; cursor: pointer; }
        .nav-links { display: flex; flex-direction: column; gap: 14px; text-align: center; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 22px; padding: 10px 30px; border-radius: 30px; background: rgba(255,255,255,0.1); }

        /* Screens */
        .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 22px; background: rgba(0,0,40,0.45); z-index: 1000; text-align: center; color: #fff; text-shadow: 0 3px 6px rgba(0,0,0,0.5); }
        .screen.hidden { display: none; }
        .screen h1 { font-size: clamp(48px, 12vw, 96px); margin: 0; color: #FFD93D; }
        .screen p { font-size: clamp(18px, 4vw, 26px); margin: 0; }
        #colors { display: flex; gap: 18px; }
        .color { width: 70px; height: 70px; border-radius: 50%; border: 5px solid rgba(255,255,255,0.4); cursor: pointer; }
        .color.on { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 20px #fff; }
        .big-btn { font: inherit; font-size: 34px; padding: 16px 54px; border-radius: 50px; border: none; cursor: pointer;
            background: linear-gradient(#7CFC00, #32CD32); color: #fff; text-shadow: 0 2px 3px rgba(0,0,0,0.4);
            box-shadow: 0 8px 0 #228B22; }
        .big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #228B22; }
        #trophy { font-size: 120px; animation: bob 1s ease-in-out infinite; }
        @keyframes bob { 50% { transform: translateY(-16px) rotate(-5deg); } }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <div id="game-nav"><button id="nav-toggle" aria-label="Games menu">☰</button></div>
    <div id="nav-overlay" class="hidden">
        <button id="nav-close" aria-label="Close">✕</button>
        <div class="nav-links"><!-- filled from games.js --></div>
    </div>

    <div id="start" class="screen">
        <h1>Racer! 🏁</h1>
        <p>Pick your car</p>
        <div id="colors"></div>
        <button class="big-btn" id="go">GO!</button>
        <p>Tap left or right to change lanes.<br>Grab ⭐ stars and drive over ⚡ to zoom!</p>
    </div>

    <div id="finish" class="screen hidden">
        <div id="trophy">🏆</div>
        <h1>1st Place!</h1>
        <p id="finish-msg"></p>
        <button class="big-btn" id="again">Race Again</button>
    </div>

<script>
// =============================================================
// Racer: a friendly 3-lane race. You can't crash and you can't lose.
//  - One tap / key press = one lane change.
//  - Stars to collect, lightning pads to zoom, cones go "boing".
//  - Three friendly rival cars to catch and pass; they move over
//    politely ("beep beep!") instead of crashing.
// =============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

const COLORS = ['#ff4757', '#1e90ff', '#2ed573', '#ffa502', '#a55eea'];
const LANES = [-0.66, 0, 0.66];          // lane centres, road half-width = 1
const RACE_LENGTH = 2200;                // world units to the finish line (~70 s)
const BASE_SPEED = 26, BOOST_SPEED = 50;  // units per second
const DRAW_DIST = 130, ZS = 10;           // ZS: distance at which things are half-way up the road
const CAR_D = 1.2, HIT_NEAR = 1.0, HIT_FAR = 4.5;

let carColor = COLORS[0];
let state = 'menu';
let lane = 1, carX = LANES[1];            // carX eases toward lane centre
let dist = 0, speed = 0, boostT = 0, bumpT = 0, wobble = 0;
let stars = 0, passed = 0;
let things = [];                          // stars, pads, cones, scenery (z = world position)
let rivals = [];
let nextSpawn = 0, particles = [], floaters = [];
let lastT = 0, finishT = 0;

// ---------- sound (tiny synth, no files) ----------
let ac = null;
function audio() {
    try {
        if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === 'suspended') ac.resume();
    } catch (e) {}
    return ac;
}
function tone(freq, dur, type = 'sine', vol = 0.2, slideTo = null, delay = 0) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
    star: () => { tone(988, 0.12, 'triangle', 0.18); tone(1319, 0.2, 'triangle', 0.18, null, 0.08); },
    zoom: () => tone(200, 0.6, 'sawtooth', 0.12, 900),
    boing: () => tone(300, 0.35, 'sine', 0.25, 120),
    lane: () => tone(500, 0.05, 'square', 0.05),
    beep: () => { tone(440, 0.12, 'square', 0.1); tone(440, 0.12, 'square', 0.1, null, 0.18); },
    pass: () => { tone(660, 0.1, 'triangle', 0.15); tone(880, 0.15, 'triangle', 0.15, null, 0.1); },
    fanfare: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, 'triangle', 0.2, null, i * 0.15))
};

// ---------- layout ----------
function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Perspective: world (x, z) -> screen. Road half-width is 1 world unit.
function horizon() { return H * 0.38; }
// z = distance ahead of the camera (0 = bottom of the screen).
function project(x, z) {
    const s = 1 / (1 + Math.max(0, z) / ZS);
    const roadHalf = W * 0.62 * s;           // half road width in px
    return { x: W / 2 + (x - carX * 0.35) * roadHalf, y: horizon() + (H - horizon()) * s, s, half: roadHalf };
}
function carScale() { return Math.min(W * 0.0016, H / 600); }  // car ~ 3/4 of a lane wide

// ---------- start / finish ----------
const colorsEl = document.getElementById('colors');
COLORS.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'color' + (i === 0 ? ' on' : '');
    d.style.background = c;
    d.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        carColor = c;
        colorsEl.querySelectorAll('.color').forEach(x => x.classList.remove('on'));
        d.classList.add('on');
        tone(600 + i * 100, 0.1, 'triangle', 0.15);
    });
    colorsEl.appendChild(d);
});
document.getElementById('go').addEventListener('click', startRace);
document.getElementById('again').addEventListener('click', () => {
    document.getElementById('finish').classList.add('hidden');
    document.getElementById('start').classList.remove('hidden');
    state = 'menu';
});

function startRace() {
    audio();
    document.getElementById('start').classList.add('hidden');
    state = 'race';
    lane = 1; carX = LANES[1];
    dist = 0; speed = 0; boostT = 0; bumpT = 0; stars = 0; passed = 0;
    things = []; particles = []; floaters = [];
    nextSpawn = 25;
    const rivalColors = COLORS.filter(c => c !== carColor);
    rivals = [
        { z: 45, lane: 0, x: LANES[0], speed: 22, color: rivalColors[0], passed: false, moveT: 0 },
        { z: 120, lane: 2, x: LANES[2], speed: 21, color: rivalColors[1], passed: false, moveT: 0 },
        { z: 210, lane: 1, x: LANES[1], speed: 20, color: rivalColors[2], passed: false, moveT: 0 }
    ];
    // Pre-fill scenery
    for (let z = 5; z < DRAW_DIST; z += 6) addScenery(z);
}

function winRace() {
    state = 'done';
    finishT = performance.now();
    sfx.fanfare();
    document.getElementById('finish-msg').textContent =
        stars > 0 ? `You got ${stars} star${stars === 1 ? '' : 's'}! ⭐` : 'Super driving!';
    setTimeout(() => document.getElementById('finish').classList.remove('hidden'), 1400);
}

// ---------- input: one tap = one lane ----------
function steer(dir) {
    if (state !== 'race') return;
    const n = Math.max(0, Math.min(2, lane + dir));
    if (n !== lane) { lane = n; sfx.lane(); }
}
canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    steer(e.clientX < W / 2 ? -1 : 1);
});
document.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (state === 'menu' && (e.key === 'Enter' || e.key === ' ')) { startRace(); return; }
    if (['ArrowLeft', 'a', 'A'].includes(e.key)) steer(-1);
    if (['ArrowRight', 'd', 'D'].includes(e.key)) steer(1);
});

// ---------- spawning ----------
const SCENERY = ['🌳', '🌲', '🌳', '🏠', '🌻', '🌳', '🏡', '🌲', '🐄'];
function addScenery(zAhead) {
    const side = Math.random() < 0.5 ? -1 : 1;
    things.push({ kind: 'scenery', z: dist + zAhead, x: side * (1.5 + Math.random() * 1.4),
        emoji: SCENERY[Math.floor(Math.random() * SCENERY.length)] });
}
function spawnPattern() {
    const z = dist + DRAW_DIST;
    const r = Math.random();
    const l = Math.floor(Math.random() * 3);
    if (r < 0.45) {
        // a little line of stars in one lane
        const n = 3 + Math.floor(Math.random() * 3);
        for (let i = 0; i < n; i++) things.push({ kind: 'star', z: z + i * 4, lane: l });
        nextSpawn = dist + 26 + n * 4;
    } else if (r < 0.65) {
        things.push({ kind: 'pad', z, lane: l });
        nextSpawn = dist + 30;
    } else if (r < 0.85) {
        things.push({ kind: 'cone', z, lane: l });
        // a star in another lane to steer toward
        things.push({ kind: 'star', z, lane: (l + 1 + Math.floor(Math.random() * 2)) % 3 });
        nextSpawn = dist + 30;
    } else {
        // star zig-zag across all lanes
        [0, 1, 2, 1, 0].forEach((ln, i) => things.push({ kind: 'star', z: z + i * 7, lane: ln }));
        nextSpawn = dist + 55;
    }
}

function burst(x, y, color, n = 14, spread = 6) {
    for (let i = 0; i < n; i++) particles.push({
        x, y, vx: (Math.random() - 0.5) * spread, vy: (Math.random() - 0.9) * spread, life: 1, color, r: 3 + Math.random() * 4
    });
}
function floatText(text, x, y, color = '#fff') { floaters.push({ text, x, y, life: 1, color }); }

// ---------- update ----------
function update(dt) {
    if (state === 'race' || state === 'done') {
        const target = state === 'done' ? 0 : (boostT > 0 ? BOOST_SPEED : BASE_SPEED) * (bumpT > 0 ? 0.6 : 1);
        speed += (target - speed) * Math.min(1, dt * (state === 'done' ? 1.2 : 2.5));
        boostT = Math.max(0, boostT - dt);
        bumpT = Math.max(0, bumpT - dt);
        wobble = Math.max(0, wobble - dt * 3);
        carX += (LANES[lane] - carX) * Math.min(1, dt * 10);
        dist += speed * dt;
    }
    if (state !== 'race') { updateFx(dt); return; }

    if (dist >= nextSpawn && dist < RACE_LENGTH - 80) spawnPattern();
    if (Math.random() < dt * 4) addScenery(DRAW_DIST + 5);

    const carScreen = project(carX, 2.5);
    // Pick-ups and cones: hit when they reach the car
    for (let i = things.length - 1; i >= 0; i--) {
        const t = things[i];
        const rel = t.z - dist;
        if (t.kind !== 'scenery' && !t.hit && rel < HIT_FAR && rel > HIT_NEAR && t.lane === lane) {
            t.hit = true;
            if (t.kind === 'star') {
                stars++; sfx.star(); burst(carScreen.x, carScreen.y - 60, '#FFD93D');
                floatText('+1 ⭐', carScreen.x, carScreen.y - 90, '#FFD93D');
                things.splice(i, 1); continue;
            } else if (t.kind === 'pad') {
                boostT = 2.8; sfx.zoom(); floatText('ZOOM!', carScreen.x, carScreen.y - 110, '#00E5FF');
            } else if (t.kind === 'cone') {
                bumpT = 0.6; wobble = 1; sfx.boing();
                t.flyX = (Math.random() < 0.5 ? -1 : 1) * 2; t.flyT = 0;
                floatText('Boing!', carScreen.x, carScreen.y - 100, '#FF8C00');
            }
        }
        if (t.flyX !== undefined) t.flyT += dt;
        if (rel < -2) things.splice(i, 1);
    }

    // Rivals
    rivals.forEach(r => {
        r.z += r.speed * dt;
        r.x += (LANES[r.lane] - r.x) * Math.min(1, dt * 4);
        const rel = r.z - dist;
        // Polite rivals: if you're coming up behind them in their lane, they move over
        if (rel > 0 && rel < 22 && r.lane === lane && r.moveT <= 0) {
            const options = [r.lane - 1, r.lane + 1].filter(n => n >= 0 && n <= 2);
            r.lane = options[Math.floor(Math.random() * options.length)];
            r.moveT = 1.2;
            sfx.beep();
            const p = project(r.x, rel);
            floatText('beep beep!', p.x, p.y - 70 * p.s, '#fff');
        }
        r.moveT -= dt;
        if (!r.passed && rel < 0) {
            r.passed = true; passed++; sfx.pass();
            floatText(passed === 3 ? "You're in 1st! 🥇" : 'Passed!', W / 2, H * 0.28 + 44 * floaters.length, '#FFD93D');
        }
    });

    if (dist >= RACE_LENGTH) {
        // Make sure you finish first, no matter what
        rivals.forEach(r => { if (!r.passed) { r.passed = true; passed++; } r.z = Math.min(r.z, dist - 5); });
        winRace();
    }
    if (boostT > 0 && Math.random() < 0.7) {
        particles.push({ x: carScreen.x + (Math.random() - 0.5) * 50, y: carScreen.y, vx: (Math.random() - 0.5) * 2,
            vy: 2 + Math.random() * 2, life: 0.8, color: Math.random() < 0.5 ? '#FF6B00' : '#FFD93D', r: 5 });
    }
    updateFx(dt);
}

function updateFx(dt) {
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= dt * 1.5; });
    particles = particles.filter(p => p.life > 0);
    floaters.forEach(f => { f.y -= 40 * dt; f.life -= dt * 0.8; });
    floaters = floaters.filter(f => f.life > 0);
    if (state === 'done' && Math.random() < 0.15) {
        burst(Math.random() * W, Math.random() * H * 0.4, `hsl(${Math.random() * 360},100%,60%)`, 24, 10);
    }
}

// ---------- drawing ----------
function drawSky() {
    const h = horizon();
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#4FC3F7'); g.addColorStop(1, '#B3E5FC');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, h + 2);
    // sun
    ctx.fillStyle = '#FFE066';
    ctx.beginPath(); ctx.arc(W * 0.82, h * 0.35, Math.min(W, H) * 0.06, 0, Math.PI * 2); ctx.fill();
    // hills (slow parallax)
    const off = (dist * 0.15) % W;
    ctx.fillStyle = '#7CB342';
    for (let k = -1; k < 3; k++) {
        const bx = k * W * 0.5 - off * 0.5;
        ctx.beginPath(); ctx.ellipse(bx + W * 0.25, h + 8, W * 0.3, h * 0.28, 0, Math.PI, 0); ctx.fill();
    }
    // clouds
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let k = 0; k < 4; k++) {
        const cx = ((k * W * 0.33 - dist * 0.05) % (W * 1.3) + W * 1.3) % (W * 1.3) - W * 0.15;
        const cy = h * (0.2 + 0.15 * (k % 2));
        ctx.beginPath(); ctx.arc(cx, cy, 22, 0, 7); ctx.arc(cx + 25, cy - 10, 28, 0, 7); ctx.arc(cx + 55, cy, 22, 0, 7); ctx.fill();
    }
}

function drawRoad() {
    const SEG = 4;
    const start = Math.floor(dist / SEG) * SEG;
    ctx.fillStyle = '#5CAE60'; ctx.fillRect(0, horizon(), W, H);
    for (let z = start + Math.ceil(DRAW_DIST / SEG) * SEG; z >= start; z -= SEG) {
        const z0 = Math.max(z - dist, 0), z1 = z + SEG - dist;
        if (z1 <= 0) continue;
        const a = project(0, z0), b = project(0, z1);
        const stripe = Math.floor(z / SEG) % 2 === 0;
        // grass
        ctx.fillStyle = stripe ? '#66BB6A' : '#5CAE60';
        ctx.fillRect(0, b.y, W, a.y - b.y + 1);
        // rumble strips
        quad(a, b, 1.12, stripe ? '#E53935' : '#FFFFFF');
        // road
        quad(a, b, 1.0, stripe ? '#555' : '#5C5C5C');
        // lane dashes
        if (stripe) {
            [-0.33, 0.33].forEach(lx => {
                const pa = project(lx, z0), pb = project(lx, z1);
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.moveTo(pa.x - pa.half * 0.025, a.y); ctx.lineTo(pa.x + pa.half * 0.025, a.y);
                ctx.lineTo(pb.x + pb.half * 0.025, b.y); ctx.lineTo(pb.x - pb.half * 0.025, b.y); ctx.fill();
            });
        }
    }
    // finish line
    const fz = RACE_LENGTH - dist;
    if (fz > 0 && fz < DRAW_DIST) drawFinish(fz);
}
function quad(a, b, w, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(a.x - a.half * w, a.y); ctx.lineTo(a.x + a.half * w, a.y);
    ctx.lineTo(b.x + b.half * w, b.y); ctx.lineTo(b.x - b.half * w, b.y);
    ctx.closePath(); ctx.fill();
}
function drawFinish(fz) {
    const a = project(0, fz), b = project(0, fz + 1.5);
    const n = 10;
    for (let i = 0; i < n; i++) for (let j = 0; j < 2; j++) {
        ctx.fillStyle = (i + j) % 2 ? '#000' : '#fff';
        const y0 = a.y + (b.y - a.y) * (j / 2), y1 = a.y + (b.y - a.y) * ((j + 1) / 2);
        const hw = a.half + (b.half - a.half) * (j / 2);
        ctx.fillRect(a.x - hw + (2 * hw / n) * i, y1, 2 * hw / n + 1, y0 - y1 + 1);
    }
    // balloon arch
    const pL = project(-1.15, fz), pR = project(1.15, fz);
    const top = pL.y - 260 * pL.s;
    ctx.lineWidth = Math.max(2, 14 * pL.s);
    ctx.strokeStyle = '#FF4081';
    ctx.beginPath(); ctx.moveTo(pL.x, pL.y); ctx.lineTo(pL.x, top); ctx.lineTo(pR.x, top); ctx.lineTo(pR.x, pR.y); ctx.stroke();
    ctx.fillStyle = '#FFD93D';
    const bw = (pR.x - pL.x) * 0.6, bh = 60 * pL.s;
    ctx.fillRect(W / 2 - bw / 2 + (pL.x + pR.x - W) / 2, top - bh / 2, bw, bh);
    ctx.fillStyle = '#C62828';
    ctx.font = `bold ${Math.max(8, 44 * pL.s)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('FINISH', (pL.x + pR.x) / 2, top);
}

function emojiAt(emoji, x, y, size) {
    ctx.font = `${size}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(emoji, x, y);
}

// A chunky cartoon car seen from behind
function drawCar(x, y, s, color, tilt = 0, flames = false) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    ctx.scale(s, s);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(0, 0, 95, 16, 0, 0, Math.PI * 2); ctx.fill();
    // wheels
    ctx.fillStyle = '#222';
    roundRect(-92, -46, 34, 46, 8); roundRect(58, -46, 34, 46, 8);
    // body
    ctx.fillStyle = color;
    roundRect(-85, -100, 170, 72, 22);
    // roof / cabin
    ctx.fillStyle = shade(color, -25);
    roundRect(-55, -150, 110, 58, 20);
    ctx.fillStyle = '#BBDEFB';
    roundRect(-44, -142, 88, 40, 12);
    // spoiler
    ctx.fillStyle = shade(color, -40);
    roundRect(-90, -112, 180, 14, 6);
    // lights
    ctx.fillStyle = '#FF1744';
    roundRect(-75, -80, 34, 16, 6); roundRect(41, -80, 34, 16, 6);
    // number plate
    ctx.fillStyle = '#FFF59D';
    roundRect(-24, -62, 48, 20, 4);
    ctx.fillStyle = '#333'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('VROOM', 0, -52);
    if (flames) {
        ctx.fillStyle = Math.random() < 0.5 ? '#FF6B00' : '#FFD93D';
        ctx.beginPath(); ctx.moveTo(-40, -30); ctx.lineTo(-30, 10 + Math.random() * 30); ctx.lineTo(-20, -30); ctx.fill();
        ctx.beginPath(); ctx.moveTo(20, -30); ctx.lineTo(30, 10 + Math.random() * 30); ctx.lineTo(40, -30); ctx.fill();
    }
    ctx.restore();
}
function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.fill();
}
function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const c = (v) => Math.max(0, Math.min(255, v + amt));
    return `rgb(${c(n >> 16)},${c((n >> 8) & 255)},${c(n & 255)})`;
}

function drawThings() {
    // everything with depth, sorted far -> near
    const list = [];
    things.forEach(t => list.push({ z: t.z - dist, t }));
    rivals.forEach(r => list.push({ z: r.z - dist, r }));
    list.sort((a, b) => b.z - a.z);
    const bob = Math.sin(performance.now() / 150) * 6;
    list.forEach(({ z, t, r }) => {
        if (z < 0 || z > DRAW_DIST) return;
        if (r) {
            const p = project(r.x, z);
            drawCar(p.x, p.y, p.s * carScale(), r.color);
            return;
        }
        const x = t.kind === 'scenery' ? t.x : LANES[t.lane];
        const p = project(x, z);
        const size = p.s * 140 * carScale();
        if (size < 3) return;
        if (t.kind === 'scenery') emojiAt(t.emoji, p.x, p.y, size * (t.emoji === '🏠' || t.emoji === '🏡' ? 1.6 : 1.3));
        else if (t.kind === 'star') emojiAt('⭐', p.x, p.y - size * 0.3 + bob * p.s, size * 0.75);
        else if (t.kind === 'pad') {
            ctx.fillStyle = t.hit ? '#80DEEA' : '#00E5FF';
            const a = project(x - 0.25, z), b = project(x + 0.25, z + 2.5);
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(project(x + 0.25, z).x, a.y);
            ctx.lineTo(b.x, b.y); ctx.lineTo(project(x - 0.25, z + 2.5).x, b.y); ctx.fill();
            emojiAt('⚡', p.x, p.y, size * 0.6);
        } else if (t.kind === 'cone') {
            const fx = t.flyX ? t.flyX * t.flyT * 3 : 0, fy = t.flyX ? -t.flyT * 300 : 0;
            ctx.save();
            const cp = project(x + fx, z);
            ctx.translate(cp.x, cp.y + fy * p.s);
            if (t.flyX) ctx.rotate(t.flyT * 12);
            emojiAt('🚧', 0, 0, size * 0.7);
            ctx.restore();
        }
    });
}

function drawHud() {
    // progress bar with car + flag
    const bw = Math.min(W * 0.6, 420), bx = (W - bw) / 2, by = 22;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; roundRect(bx - 6, by - 6, bw + 12, 28, 14);
    ctx.fillStyle = '#fff'; roundRect(bx, by, bw, 16, 8);
    const f = Math.min(1, dist / RACE_LENGTH);
    ctx.fillStyle = carColor; roundRect(bx, by, Math.max(16, bw * f), 16, 8);
    emojiAt('🏁', bx + bw + 22, by + 26, 30);
    emojiAt('🏎️', bx + bw * f, by + 22, 26);
    // stars + place on a little badge
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; roundRect(W - 132, 56, 120, 80, 16);
    ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#000'; ctx.fillText(`⭐ ${stars}`, W - 18, 64);
    ctx.fillStyle = '#FFD93D'; ctx.fillText(`⭐ ${stars}`, W - 20, 62);
    const place = 4 - passed;
    const label = ['🥇 1st', '🥈 2nd', '🥉 3rd', '4th'][place - 1];
    ctx.fillStyle = '#fff'; ctx.fillText(label, W - 20, 100);
}

function drawFx() {
    particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    floaters.forEach(f => {
        ctx.globalAlpha = Math.max(0, f.life);
        ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.strokeText(f.text, f.x, f.y);
        ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
    });
    ctx.globalAlpha = 1;
    // speed lines while zooming
    if (boostT > 0) {
        ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 3;
        for (let i = 0; i < 10; i++) {
            const ang = Math.random() * Math.PI * 2, r0 = Math.min(W, H) * 0.35, r1 = r0 + 80;
            ctx.beginPath();
            ctx.moveTo(W / 2 + Math.cos(ang) * r0, horizon() + Math.sin(ang) * r0);
            ctx.lineTo(W / 2 + Math.cos(ang) * r1, horizon() + Math.sin(ang) * r1);
            ctx.stroke();
        }
    }
}

function drawPlayer() {
    const tilt = (LANES[lane] - carX) * 0.25 + Math.sin(performance.now() / 40) * 0.08 * wobble;
    const bounce = state === 'race' ? Math.sin(performance.now() / 70) * 1.5 : 0;
    const p = project(carX, CAR_D);
    drawCar(p.x, p.y + bounce, carScale() * p.s, carColor, tilt, boostT > 0);
}

// Menu: an idle road scrolling behind the start screen
function frame(t) {
    const dt = Math.min(0.05, (t - (lastT || t)) / 1000);
    lastT = t;
    if (state === 'menu') {
        dist += 20 * dt;
        if (Math.random() < dt * 3) addScenery(DRAW_DIST + 5);
        things = things.filter(x => x.z - dist > 0.3);
    }
    update(dt);
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawRoad();
    drawThings();
    if (state !== 'menu') drawPlayer();
    drawFx();
    if (state !== 'menu') drawHud();
    requestAnimationFrame(frame);
}
for (let z = 5; z < DRAW_DIST; z += 5) addScenery(z);
requestAnimationFrame(frame);

// Menu logic
document.getElementById('nav-toggle').addEventListener('click', () => document.getElementById('nav-overlay').classList.remove('hidden'));
document.getElementById('nav-close').addEventListener('click', () => document.getElementById('nav-overlay').classList.add('hidden'));
</script>
